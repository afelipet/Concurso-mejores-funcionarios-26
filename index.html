<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulador Mejores de Carrera 2026</title>
<meta name="description" content="Simulador de la prueba de conocimientos del concurso Mejores Empleados y Empleadas de Carrera Administrativa 2026 de la Personería de Bogotá. Metodología Tipo I, II y III.">
<meta name="theme-color" content="#0F766E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8F0; --surface:#FFFFFF; --soft:#FDEFE3; --line:#EADBCB;
  --ink:#24323F; --muted:#5E6B78;
  --teal:#0F766E; --teal-soft:#D7F0EC;
  --coral:#E8574B; --coral-soft:#FCE1DD;
  --amber:#C98A0B; --amber-soft:#FBEBC6;
  --violet:#6250C8; --violet-soft:#E6E2FA;
  --ok:#1E7F4F; --ok-soft:#DCF3E6;
  --bad:#C2362B; --bad-soft:#FBE0DD;
  --shadow:0 6px 24px rgba(36,50,63,.08);
  --r:18px; --on:#FFFFFF;
  --display:'Fraunces',Georgia,serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14191F; --surface:#1C232B; --soft:#232C36; --line:#2F3A46;
    --ink:#EEF2F5; --muted:#A6B2BE;
    --teal:#3CC4B4; --teal-soft:#173A37;
    --coral:#FF8A7E; --coral-soft:#3E2422;
    --amber:#F2C24E; --amber-soft:#3B3017;
    --violet:#A598F5; --violet-soft:#2A2645;
    --ok:#5BD49A; --ok-soft:#173527; --bad:#FF8A7E; --bad-soft:#3E2422;
    --shadow:0 6px 24px rgba(0,0,0,.35); --on:#0F1418;
  }
}
:root[data-theme="dark"]{
  --bg:#14191F; --surface:#1C232B; --soft:#232C36; --line:#2F3A46;
  --ink:#EEF2F5; --muted:#A6B2BE;
  --teal:#3CC4B4; --teal-soft:#173A37;
  --coral:#FF8A7E; --coral-soft:#3E2422;
  --amber:#F2C24E; --amber-soft:#3B3017;
  --violet:#A598F5; --violet-soft:#2A2645;
  --ok:#5BD49A; --ok-soft:#173527; --bad:#FF8A7E; --bad-soft:#3E2422;
  --shadow:0 6px 24px rgba(0,0,0,.35); --on:#0F1418;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 64px}
/* top bar */
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left}
.logo{width:36px;height:36px;border-radius:11px;background:conic-gradient(from 200deg,var(--teal),var(--violet),var(--coral),var(--amber),var(--teal));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex:none}
.brand b{font-family:var(--display);font-size:1.05rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.78rem}
.top .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-size:.9rem;font-weight:700}
.progress{height:5px;background:transparent}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--violet));transition:width .3s}
/* hero */
.hero{margin:22px 0 18px;padding:26px 22px;border-radius:26px;background:linear-gradient(135deg,var(--teal-soft),var(--violet-soft) 55%,var(--coral-soft));position:relative;overflow:hidden}
.hero h1{font-family:var(--display);font-size:clamp(1.6rem,5vw,2.3rem);line-height:1.15;margin-bottom:8px}
.hero p{color:var(--muted);max-width:56ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:700;box-shadow:var(--shadow)}
.count{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.count div{background:var(--surface);border-radius:14px;padding:10px 14px;min-width:74px;text-align:center;box-shadow:var(--shadow)}
.count b{font-family:var(--display);font-size:1.6rem;display:block;line-height:1}
.count span{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
h2.sec{font-family:var(--display);font-size:1.35rem;margin:26px 0 12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
button.card:hover{transform:translateY(-2px);border-color:var(--teal)}
.card .k{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.card h3{font-family:var(--display);font-size:1.15rem;line-height:1.25}
.card p{color:var(--muted);font-size:.92rem}
.card .st{margin-top:auto;padding-top:6px;font-size:.85rem;font-weight:800}
.c-teal .k{color:var(--teal)} .c-coral .k{color:var(--coral)} .c-amber .k{color:var(--amber)} .c-violet .k{color:var(--violet)}
.c-teal{border-top:5px solid var(--teal)} .c-coral{border-top:5px solid var(--coral)} .c-amber{border-top:5px solid var(--amber)} .c-violet{border-top:5px solid var(--violet)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:800;background:var(--teal);color:var(--on);min-height:48px}
.btn.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.coral{background:var(--coral)}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* topic picker */
.tlist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));margin:12px 0}
.tpick{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg);font-size:.9rem;cursor:pointer}
.tpick input{margin-top:4px;accent-color:var(--teal);width:18px;height:18px;flex:none}
.tpick .n{font-weight:800;color:var(--muted);font-size:.78rem}
select,input[type=number]{font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 10px;flex-wrap:wrap}
.pill{font-size:.78rem;font-weight:800;border-radius:999px;padding:5px 11px;background:var(--soft);color:var(--muted)}
.pill.t1{background:var(--teal-soft);color:var(--teal)} .pill.t2{background:var(--amber-soft);color:var(--amber)} .pill.t3{background:var(--violet-soft);color:var(--violet)}
.timer{font-variant-numeric:tabular-nums;font-weight:800}
.howto{font-size:.88rem;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.qtext{font-size:1.12rem;font-weight:700;margin-bottom:14px}
.stmts{list-style:none;display:grid;gap:8px;margin:0 0 14px}
.stmts li{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px}
.stmts b{color:var(--amber);font-family:var(--display)}
.ar{display:grid;gap:8px;margin-bottom:14px}
.ar div{border-radius:12px;padding:10px 12px;background:var(--violet-soft)}
.ar span{font-size:.75rem;font-weight:800;letter-spacing:.06em;color:var(--violet);display:block}
.porque{text-align:center;font-weight:800;color:var(--violet);letter-spacing:.2em;font-size:.8rem}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:52px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt .l{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:var(--soft)}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt.sel .l{background:var(--teal);color:var(--on)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)} .opt.ok .l{background:var(--ok);color:var(--on)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .l{background:var(--bad);color:var(--on)}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:14px;padding:14px;border-left:5px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)} .fb.no{background:var(--bad-soft);border-color:var(--bad)}
.fb h4{font-size:1rem;margin-bottom:4px}
.fb .src{font-size:.82rem;color:var(--muted);margin-top:6px}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.mark{background:none;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700}
.mark.on{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:16px}
.dot{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:800;font-size:.85rem}
.dot.ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
.dot.mk{box-shadow:inset 0 -4px 0 var(--amber)}
.dot.cur{outline:3px solid var(--violet)}
/* results */
.score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.ring{--p:0;width:130px;height:130px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--soft) 0);display:grid;place-items:center;flex:none}
.ring div{width:100px;height:100px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center}
.ring b{font-family:var(--display);font-size:2rem;line-height:1}
.ring small{font-size:.75rem;color:var(--muted);font-weight:700}
.verdict{font-family:var(--display);font-size:1.3rem}
.bars{display:grid;gap:10px;margin-top:12px}
.bar .t{display:flex;justify-content:space-between;font-size:.88rem;font-weight:700;gap:8px}
.bar .tr{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:4px}
.bar .tr i{display:block;height:100%;border-radius:99px}
.rev{display:grid;gap:10px;margin-top:12px}
.rev details{border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--bg)}
.rev summary{cursor:pointer;font-weight:700}
.rev .ans{margin-top:8px;font-size:.92rem}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.list{padding-left:20px;display:grid;gap:6px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.warn{background:var(--amber-soft);border-radius:14px;padding:14px;margin-top:12px;font-size:.92rem}
.tchip{display:inline-block;font-size:.82rem;font-weight:800;border-radius:10px;padding:6px 10px;line-height:1.3}
.tc0{background:var(--teal-soft);color:var(--teal)} .tc1{background:var(--coral-soft);color:var(--coral)} .tc2{background:var(--violet-soft);color:var(--violet)} .tc3{background:var(--amber-soft);color:var(--amber)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.88rem;border-radius:11px;width:auto}
.drow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.dmain{display:flex;flex-direction:column;gap:4px;align-items:flex-start;flex:1;min-width:220px}
.st{font-size:.75rem;font-weight:800;border-radius:999px;padding:3px 10px;text-transform:uppercase;letter-spacing:.04em}
.st.bad{background:var(--bad-soft);color:var(--bad)} .st.amb{background:var(--amber-soft);color:var(--amber)} .st.good{background:var(--ok-soft);color:var(--ok)} .st.muted2{background:var(--soft);color:var(--muted)}
.bib a{font-weight:700;word-break:break-word}
.hl{outline:3px solid var(--violet)}
@media (max-width:560px){.btn.sm{width:auto}}
footer{margin-top:36px;color:var(--muted);font-size:.82rem;text-align:center}
@media (max-width:560px){body{font-size:16px}.hero{padding:20px 16px}.btn{width:100%}.qnav .btn{width:auto;flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <button class="brand" onclick="go('home')" aria-label="Ir al inicio">
      <span class="logo" aria-hidden="true">PB</span>
      <span><b>Mejores de Carrera 2026</b><small>Simulador de la prueba de conocimientos</small></span>
    </button>
    <span class="sp"></span>
    <button class="iconbtn" id="themeBtn" onclick="toggleTheme()" aria-label="Cambiar tema claro u oscuro"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" style="vertical-align:-3px;margin-right:4px"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg>Tema</button>
  </div>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
</header>
<main class="wrap" id="app" tabindex="-1"></main>
<div aria-live="polite" class="sr" id="live" style="position:absolute;left:-9999px"></div>

<script>
/* Banco de preguntas — Parte 1: temas institucionales.
   Tipo I: la opción correcta se escribe PRIMERO (la app baraja las opciones).
   Tipo II: a = 0:A(1,2,3) 1:B(1,3) 2:C(2,4) 3:D(solo 4)
   Tipo III: a = 0:A(V,V,explica) 1:B(V,V,no explica) 2:C(V,F) 3:D(F,V) */
const Q1 = [
/* ───────── T1 · Acuerdo Distrital 978 de 2025 ───────── */
{tm:"T1",t:1,q:"El Concejo de Bogotá expidió el Acuerdo 978 de 2025 invocando, entre otras, la atribución del numeral 15 del artículo 12 del Decreto Ley 1421 de 1993. ¿Qué faculta esa disposición?",
o:["Organizar la Personería y la Contraloría Distritales y dictar las normas necesarias para su funcionamiento","Determinar la estructura general de la Administración Central y adoptar las escalas de remuneración","Crear los empleos necesarios para el funcionamiento del propio Concejo","Expedir las normas que regulan las relaciones del Distrito con sus servidores, en especial la carrera administrativa"],
e:"El numeral 15 del art. 12 del DL 1421 atribuye al Concejo organizar la Personería y la Contraloría. Los numerales 8, 20 y 21 regulan, respectivamente, la estructura de la Administración Central, los empleos del Concejo y las relaciones con los servidores; no son la base específica para reestructurar la Personería.",f:"Acuerdo 978/2025, encabezado; DL 1421/1993, art. 12"},
{tm:"T1",t:1,q:"Según el artículo 1 del Acuerdo 978 de 2025, la naturaleza jurídica de la Personería de Bogotá es la de:",
o:["Un organismo de control y vigilancia que ejerce el Ministerio Público en el Distrito Capital","Una entidad descentralizada del sector Gobierno con autonomía administrativa y presupuestal","Una dependencia territorial de la Procuraduría General de la Nación con sede en Bogotá","Un órgano autónomo del orden nacional adscrito a la Defensoría del Pueblo"],
e:"El art. 1, con apoyo en los arts. 117 y 118 de la Constitución y los arts. 5, 99, 100 y 101 del DL 1421, define a la Personería como organismo de control y vigilancia que ejerce el Ministerio Público en el Distrito. No pertenece a la administración, ni a la PGN ni a la Defensoría.",f:"Acuerdo 978/2025, art. 1"},
{tm:"T1",t:1,q:"El artículo 4 del Acuerdo 978 de 2025 menciona expresamente leyes que son «fuentes de funciones adicionales» para la Personería. ¿Cuál NO está entre ellas?",
o:["Ley 1755 de 2015 (derecho de petición)","Ley 1448 de 2011 (víctimas)","Ley 1480 de 2011 (Estatuto del Consumidor)","Ley 1551 de 2012 (modificatoria de la Ley 136 de 1994)"],
e:"El art. 4 cita como fuentes adicionales las Leyes 1448 de 2011, 1480 de 2011 y 1551 de 2012. La Ley 1755 de 2015 rige el derecho de petición, pero no es citada en ese artículo.",f:"Acuerdo 978/2025, art. 4"},
{tm:"T1",t:2,q:"Sobre las dependencias SUPRIMIDAS por el artículo 7 del Acuerdo 978 de 2025:",
s:["Se suprimió la Personería Delegada para la Coordinación de Gestión de las Personerías Locales.","Se suprimió la Personería Delegada para Asuntos Policivos y Civiles.","Se suprimió la Personería Delegada para la Asistencia en Asuntos Jurisdiccionales.","Se suprimió la Personería Delegada para la Segunda Instancia."],a:1,
e:"El art. 7 suprimió seis delegadas: las cuatro «de Coordinación» (Personerías Locales, Prevención y Control, Potestad Disciplinaria, Ministerio Público y DD.HH.), la de Orientación y Asistencia a las Personas y la de Asistencia en Asuntos Jurisdiccionales (1 y 3 verdaderas). Asuntos Policivos y Civiles (art. 39) y Segunda Instancia (art. 42) siguen existiendo.",f:"Acuerdo 978/2025, arts. 7, 39 y 42"},
{tm:"T1",t:1,q:"La Personería Delegada para el Relacionamiento con el Ciudadano y Asuntos Locales, creada por el Acuerdo 978 de 2025, depende de:",
o:["El Despacho del Personero o Personera","La Personería Auxiliar","La Personería Delegada para la Misionalidad del Ministerio Público y la Función Pública","La Secretaría General"],
e:"El art. 10 la crea como dependiente del Despacho. A ella se adscriben las Direcciones de Orientación y Asistencia a las Personas, de Asistencia en Asuntos Jurisdiccionales, de Conciliación y las personerías locales (art. 28).",f:"Acuerdo 978/2025, arts. 10 y 28"},
{tm:"T1",t:1,q:"La Personería Delegada para la Misionalidad del Ministerio Público y la Función Pública depende de:",
o:["La Personería Auxiliar","El Despacho del Personero, como proceso estratégico","La Delegada para el Relacionamiento con el Ciudadano y Asuntos Locales","La Dirección de Planeación"],
e:"El art. 30 la crea dependiente de la Personería Auxiliar; su función es asesorar a esa instancia y articular a las delegadas que ejercen Ministerio Público y control a la función pública.",f:"Acuerdo 978/2025, arts. 30-31"},
{tm:"T1",t:3,af:"Tras el Acuerdo 978 de 2025, la Personería de Bogotá cuenta con treinta personerías locales.",
rz:"El Acuerdo creó, con enfoque territorial, diez personerías locales identificadas con el numeral II (Usaquén, Chapinero, San Cristóbal, Usme, Bosa, Kennedy, Fontibón, Engativá, Suba y Ciudad Bolívar), que se suman a las veinte existentes.",a:0,
e:"El art. 25 crea diez personerías locales «II» y el art. 26 enumera las treinta resultantes. La razón explica directamente la afirmación.",f:"Acuerdo 978/2025, arts. 25-26"},
{tm:"T1",t:1,q:"¿Cuál de las siguientes funciones NO corresponde a la Personería Delegada para Asuntos Policivos y Civiles según el artículo 39 del Acuerdo 978 de 2025?",
o:["Ejercer las funciones de Ministerio Público ante las Curadurías Urbanas del Distrito Capital","Ejercer el Ministerio Público ante los jueces civiles municipales","Intervenir como Ministerio Público en los procesos contravencionales de movilidad cuando lo considere necesario","Velar por el cumplimiento de las órdenes de policía proferidas por el Alcalde Mayor, los alcaldes locales y los inspectores de policía"],
e:"El Ministerio Público ante las curadurías urbanas corresponde a la Delegada para el Sector Planeación (art. 63, num. 14). Las otras tres son funciones del art. 39 (nums. 5, 6 y 3).",f:"Acuerdo 978/2025, arts. 39 y 63"},
{tm:"T1",t:2,q:"Sobre las secretarías técnicas de comités institucionales asignadas por el Acuerdo 978 de 2025:",
s:["La Dirección de Planeación ejerce la secretaría técnica del Comité Institucional de Gestión y Desempeño.","La Oficina de Control Interno ejerce la secretaría técnica del Comité de Conciliación.","La Oficina de Control Interno ejerce la secretaría técnica del Comité Institucional de Coordinación del Sistema de Control Interno.","La Oficina Asesora Jurídica ejerce la secretaría técnica del Comité Institucional de Coordinación del Sistema de Control Interno."],a:1,
e:"Art. 40 num. 11: Planeación → CIGD. Art. 41 num. 13: Control Interno → Comité de Coordinación de Control Interno. El Comité de Conciliación tiene como secretaría técnica a la Oficina Asesora Jurídica cuando se le designe (art. 44 num. 9). Son verdaderas 1 y 3.",f:"Acuerdo 978/2025, arts. 40, 41 y 44"},
{tm:"T1",t:1,q:"Un servidor de carrera de la Personería apela su evaluación definitiva del desempeño laboral. ¿Qué dependencia proyecta, para firma del Personero, la decisión del recurso?",
o:["La Personería Delegada para la Segunda Instancia","La Oficina de Control Interno","La Oficina Asesora Jurídica","La Subdirección de Desarrollo del Talento Humano"],
e:"El art. 42 num. 5 asigna a la Delegada para la Segunda Instancia proyectar las decisiones de apelación contra evaluaciones definitivas de desempeño de servidores de carrera y en período de prueba, así como impedimentos y recusaciones en esas actuaciones.",f:"Acuerdo 978/2025, art. 42"},
{tm:"T1",t:3,af:"La Oficina de Control Interno forma parte de los procesos estratégicos de la Personería, junto con Planeación y la Oficina Asesora Jurídica.",
rz:"El Acuerdo 978 de 2025 considera a la Oficina de Control Interno independiente, en virtud de que su rol es el control y seguimiento a la operación y gestión de la entidad.",a:3,
e:"El art. 27 enumera las dependencias de procesos estratégicos y aclara que Control Interno «se considera independiente». La afirmación es falsa; la razón es verdadera.",f:"Acuerdo 978/2025, art. 27"},
{tm:"T1",t:1,q:"¿Qué función asignó expresamente el Acuerdo 978 de 2025 a la Dirección de Tecnologías de la Información y las Comunicaciones (DTIC)?",
o:["Expedir lineamientos y directrices para la adopción y uso responsable de la inteligencia artificial en los procesos institucionales","Certificar ante la Superintendencia de Industria y Comercio el cumplimiento de la Ley 1581 de 2012","Ejercer la secretaría técnica del Comité Institucional de Gestión y Desempeño","Administrar el Sistema Distrital de Quejas y Soluciones de toda la Administración Distrital"],
e:"El art. 18 num. 12 asigna a la DTIC expedir lineamientos para el uso responsable de la IA. La secretaría del CIGD es de Planeación; las demás opciones no le corresponden.",f:"Acuerdo 978/2025, art. 18"},
{tm:"T1",t:1,q:"Una persona solicita su inscripción en el Registro Único de Víctimas más de dos años después del hecho victimizante. Según el Acuerdo 978 de 2025, la Delegada para la Protección de las Víctimas debe:",
o:["Investigar las circunstancias de tiempo, modo y lugar para establecer si existieron barreras que dificultaron el acceso a la protección del Estado","Rechazar de plano la solicitud por extemporánea","Remitir la solicitud a la Fiscalía para que valide los hechos","Ordenar a la Unidad para las Víctimas la inclusión inmediata en el registro"],
e:"El art. 36 num. 3 ordena investigar las circunstancias cuando la solicitud llega pasados más de dos años, para determinar si hubo barreras de acceso. La decisión de inclusión corresponde a la Unidad para las Víctimas.",f:"Acuerdo 978/2025, art. 36"},
{tm:"T1",t:1,q:"Con el Acuerdo 978 de 2025, la antigua Personería Delegada para la Potestad Disciplinaria IV pasó a denominarse:",
o:["Personería Delegada para el Juzgamiento Disciplinario I","Personería Delegada para la Instrucción Disciplinaria IV","Personería Delegada para la Segunda Instancia","Dirección de Investigaciones Especiales y Apoyo Técnico"],
e:"El art. 8 renombró las Potestades Disciplinarias I a III como de Instrucción Disciplinaria I a III, y la IV como Juzgamiento Disciplinario I, en armonía con la separación de instrucción y juzgamiento de la Ley 2094 de 2021.",f:"Acuerdo 978/2025, art. 8"},
{tm:"T1",t:2,q:"Sobre las funciones de la Personería Delegada para la Defensa y Protección de los Derechos Humanos II:",
s:["Verifica las acciones de promoción de derechos con enfoque diferencial y énfasis en sujetos de especial protección constitucional.","Ejerce de forma exclusiva el Ministerio Público ante las URI y estaciones de policía.","Realiza acompañamiento a las alertas tempranas emitidas por la Defensoría del Pueblo.","Ejerce la secretaría técnica de la Mesa Distrital de Participación Efectiva de Víctimas."],a:1,
e:"Art. 34 nums. 2 y 9: enfoque diferencial y alertas tempranas (1 y 3 verdaderas). El Ministerio Público ante personas privadas de la libertad (URI, estaciones) es de la Delegada de DD.HH. I (art. 32 num. 2) y la secretaría técnica de la Mesa de Víctimas es de la Delegada para las Víctimas (art. 36 num. 7).",f:"Acuerdo 978/2025, arts. 32, 34 y 36"},

/* ───────── T2 · Decreto Ley 1421 de 1993 ───────── */
{tm:"T2",t:1,q:"Según el artículo 5 del Decreto Ley 1421 de 1993, son organismos de control y vigilancia del Distrito Capital:",
o:["La Personería, la Contraloría y la Veeduría","La Personería, la Contraloría y la Procuraduría","La Personería, la Veeduría y la Defensoría del Pueblo","La Contraloría, la Veeduría y la Secretaría General"],
e:"El art. 5, tras enumerar las autoridades de gobierno y administración, señala que son organismos de control y vigilancia la Personería, la Contraloría y la Veeduría.",f:"DL 1421/1993, art. 5"},
{tm:"T2",t:1,q:"El Personero que ejerza el cargo en propiedad solo puede ser suspendido o removido antes del vencimiento de su período por:",
o:["Sentencia judicial o decisión de la Procuraduría General de la Nación","Decisión del Concejo adoptada con mayoría calificada","Moción de observaciones aprobada por el Concejo","Decisión del Alcalde Mayor, previa solicitud de la Contraloría"],
e:"El art. 17 consagra la inamovilidad del Contralor y del Personero: solo sentencia judicial o decisión de la PGN. La moción de observaciones (art. 15) permite «observar» decisiones, pero no remover.",f:"DL 1421/1993, arts. 15 y 17"},
{tm:"T2",t:1,q:"Si el Concejo cita al Personero en ejercicio del control político, la citación debe hacerse:",
o:["Con anticipación no menor de cinco días hábiles y en cuestionario escrito","Con anticipación no menor de tres días calendario y de forma verbal","Con anticipación no menor de diez días hábiles y en cuestionario escrito","Sin término mínimo, siempre que se trate de sesiones extraordinarias"],
e:"El art. 14 exige cuestionario escrito y anticipación no menor de cinco días hábiles; el citado radica la respuesta dentro del tercer día hábil siguiente al recibo.",f:"DL 1421/1993, art. 14"},
{tm:"T2",t:2,q:"Sobre las atribuciones del Personero como agente del Ministerio Público (art. 99 DL 1421):",
s:["Puede actuar directamente o por delegados en procesos civiles, contenciosos, laborales, de familia, penales, agrarios, mineros y de policía.","Sus delegados deben acreditar las mismas calidades de los jueces ante quienes actúan.","Puede interponer la acción de tutela y asumir la representación del Defensor del Pueblo cuando este se la delegue.","Le corresponde adelantar los procesos de responsabilidad fiscal contra los servidores distritales."],a:1,
e:"Son verdaderas 1 y 3 (art. 99 nums. 1 y 4). El inciso final aclara que los delegados NO deben acreditar las calidades de magistrados, jueces y fiscales. La responsabilidad fiscal es de la Contraloría.",f:"DL 1421/1993, art. 99"},
{tm:"T2",t:1,q:"Como veedor ciudadano, para velar por la efectividad del derecho de petición, el Personero debe, según el DL 1421:",
o:["Instruir a quienes deseen presentar una petición y escribir las de quienes no pudieren o no supieren hacerlo","Resolver de fondo las peticiones dirigidas a otras entidades distritales","Imponer multas sucesivas a las autoridades que no respondan dentro del término","Autorizar a las entidades la ampliación del plazo de respuesta"],
e:"El art. 100 num. 4 le ordena instruir debidamente, escribir las peticiones de quienes no puedan o sepan hacerlo y solicitar que se tramiten. No decide por otras entidades ni impone multas.",f:"DL 1421/1993, art. 100"},
{tm:"T2",t:3,af:"El Personero debe velar por el respeto de los derechos humanos de las personas recluidas en establecimientos carcelarios, psiquiátricos, hospitalarios, ancianatos y orfelinatos.",
rz:"El Decreto Ley 1421 de 1993 le asigna esa atribución en su calidad de defensor de los derechos humanos.",a:0,
e:"Es la atribución del art. 101 num. 6, ubicada en el catálogo del Personero como defensor de los derechos humanos. La razón explica la afirmación.",f:"DL 1421/1993, art. 101"},
{tm:"T2",t:1,q:"Según el texto vigente del artículo 97 del DL 1421 (modificado por la Ley 1031 de 2006), el período del Personero Distrital es:",
o:["Institucional de cuatro años, que inicia el 1 de marzo y concluye el último día de febrero","Personal de tres años, que inicia el 1 de enero siguiente a su elección","Institucional de cuatro años, coincidente con el del Alcalde Mayor y que inicia el 1 de enero","De cuatro años, que inicia el 1 de agosto, al comenzar el segundo período de sesiones del Concejo"],
e:"El art. 97, modificado por la Ley 1031 de 2006, fija un período institucional de cuatro años del 1 de marzo al último día de febrero. El texto original (art. 96, derogado) preveía tres años.",f:"DL 1421/1993, art. 97"},
{tm:"T2",t:1,q:"En caso de falta temporal del Personero Distrital, el cargo lo desempeña:",
o:["El funcionario de la Personería que le siga en jerarquía","La persona que designe el Concejo en sesión extraordinaria","La persona que designe el Alcalde Mayor","El Procurador Regional de Bogotá"],
e:"El art. 98: en faltas temporales asume el funcionario que le siga en jerarquía; en faltas absolutas el Concejo elige para el resto del período.",f:"DL 1421/1993, art. 98"},
{tm:"T2",t:1,q:"Entre las atribuciones especiales del Personero (art. 102 DL 1421) está:",
o:["Rendir semestralmente informe al Concejo sobre el cumplimiento de sus funciones","Rendir anualmente informe al Alcalde Mayor sobre la gestión de la Personería","Rendir trimestralmente informe a la Procuraduría General de la Nación","Presentar semestralmente su presupuesto a la Contraloría para aprobación"],
e:"El art. 102 num. 2 dispone el informe semestral al Concejo. También le corresponde nombrar y remover a sus funcionarios, presentar proyectos de acuerdo y expedir certificados de antecedentes disciplinarios.",f:"DL 1421/1993, art. 102"},
{tm:"T2",t:2,q:"Sobre la estructura administrativa del Distrito Capital (art. 54 DL 1421):",
s:["La Personería integra el sector descentralizado por servicios.","El sector de las localidades lo integran las juntas administradoras y los alcaldes locales.","La Universidad Distrital Francisco José de Caldas es un establecimiento público del sector central.","Las empresas industriales o comerciales y las sociedades de economía mixta hacen parte del sector descentralizado."],a:2,
e:"Son verdaderas 2 y 4. La Personería es organismo de control, no parte de la administración (art. 5). La Universidad Distrital tiene naturaleza de ente universitario autónomo (art. 54).",f:"DL 1421/1993, arts. 5 y 54"},
{tm:"T2",t:1,q:"Según el DL 1421, el Personero puede presentar proyectos de acuerdo:",
o:["En materias relacionadas con sus atribuciones","Sobre cualquier materia de interés distrital","Únicamente sobre el presupuesto anual de rentas y gastos","En ningún caso, porque la iniciativa es privativa del Alcalde y los concejales"],
e:"El art. 13 permite al personero, al contralor y a las juntas administradoras presentar proyectos en materias relacionadas con sus atribuciones; el art. 102 num. 3 lo reitera.",f:"DL 1421/1993, arts. 13 y 102"},
{tm:"T2",t:3,af:"El Concejo es la suprema autoridad del Distrito Capital.",
rz:"En materia administrativa las atribuciones del Concejo son de carácter ejecutivo y de gestión directa de los servicios públicos.",a:2,
e:"El art. 8 dice que el Concejo es la suprema autoridad, pero precisa que en materia administrativa sus atribuciones son de carácter NORMATIVO; además vigila y controla la gestión. La ejecución corresponde al Alcalde Mayor (art. 35).",f:"DL 1421/1993, arts. 8 y 35"},
{tm:"T2",t:1,q:"La moción de observaciones contra decisiones del Personero requiere ser propuesta con la firma de:",
o:["Por lo menos la tercera parte de los miembros del Concejo","Por lo menos la mitad más uno de los miembros del Concejo","La Mesa Directiva y la comisión que adelantó el debate","Al menos diez concejales de distintos partidos"],
e:"El art. 15: propuesta con firma de al menos la tercera parte, votada entre el tercer y el décimo día siguientes al debate y aprobada por la mitad más uno de los miembros. Aplica también al Contralor y al Personero.",f:"DL 1421/1993, art. 15"},

/* ───────── T3 · Resolución 180 de 2025 — MECI y Modelo de Gestión ───────── */
{tm:"T3",t:1,q:"¿Qué describe correctamente el objeto de la Resolución 180 del 6 de mayo de 2025 de la Personería de Bogotá?",
o:["Adopta el Modelo Estándar de Control Interno (MECI), crea el Comité Directivo Institucional, adopta el Modelo de Gestión y sus sistemas de gestión, y deroga la Resolución 250 de 2023","Adopta el Plan Estratégico Institucional 2024-2028 y crea el Comité Institucional de Gestión y Desempeño","Adopta el Código de Integridad y conforma el equipo de gestores de integridad","Actualiza el Manual Específico de Funciones y de Competencias Laborales"],
e:"Es el título de la Resolución 180 de 2025 publicado por la entidad. El Manual de funciones se actualizó por la Resolución 1567-10000-2026.",f:"Personería de Bogotá, Resoluciones 2025"},
{tm:"T3",t:1,q:"El Modelo Estándar de Control Interno, en su estructura vigente, se organiza en cinco componentes. ¿Cuál opción los recoge?",
o:["Ambiente de control, evaluación del riesgo, actividades de control, información y comunicación, y actividades de monitoreo","Planear, hacer, verificar, actuar y mejorar","Direccionamiento estratégico, talento humano, gestión con valores, evaluación de resultados y gestión del conocimiento","Autocontrol, autorregulación, autogestión, autoevaluación y autodisciplina"],
e:"La estructura del MECI sigue el modelo COSO: ambiente de control, evaluación (gestión) del riesgo, actividades de control, información y comunicación, y monitoreo. La tercera opción mezcla dimensiones de MIPG; la cuarta, principios del MECI 2014.",f:"Ley 87/1993; Dec. 1083/2015 mod. Dec. 1499/2017 (MECI)"},
{tm:"T3",t:2,q:"Sobre el esquema de líneas de defensa del MECI:",
s:["La línea estratégica está a cargo del Comité Directivo Institucional y del Comité Institucional de Coordinación del Sistema de Control Interno.","La primera línea de defensa la ejerce la Oficina de Control Interno mediante auditorías.","La segunda línea la integran, entre otros, el Personero Auxiliar, el Secretario General y el Director de Planeación.","La tercera línea de defensa corresponde a los gerentes públicos y líderes de proceso."],a:1,
e:"Verdaderas 1 y 3. Según la Res. 180, la primera línea son los responsables de procesos, jefes de dependencia, gerentes de proyectos y equipos de trabajo; la tercera es el Jefe de la Oficina de Control Interno.",f:"Res. 180/2025, art. 3"},
{tm:"T3",t:1,q:"En la Personería de Bogotá, la secretaría técnica del Comité Institucional de Coordinación del Sistema de Control Interno la ejerce:",
o:["La Oficina de Control Interno","La Dirección de Planeación","La Secretaría General","La Oficina Asesora Jurídica"],
e:"El Acuerdo 978 de 2025, art. 41 num. 13, la asigna a la Oficina de Control Interno.",f:"Acuerdo 978/2025, art. 41"},
{tm:"T3",t:3,af:"La Personería de Bogotá, como organismo de control, está obligada a aplicar la política de control interno de la Ley 87 de 1993.",
rz:"El Decreto 1083 de 2015, modificado por el Decreto 1499 de 2017, dispone que los organismos de control aplican la política de control interno y las demás políticas de gestión y desempeño en la medida en que les sean aplicables.",a:0,
e:"El régimen de MIPG prevé que órganos autónomos y de control apliquen la política de control interno de la Ley 87 y las demás políticas en lo que les sea aplicable. Eso explica que la Personería adopte el MECI y un Modelo de Gestión propio.",f:"Dec. 1083/2015 mod. Dec. 1499/2017; Ley 87/1993"},
{tm:"T3",t:1,q:"La Ley 87 de 1993 define el control interno como:",
o:["El sistema integrado por el esquema de organización y el conjunto de planes, métodos, principios, normas, procedimientos y mecanismos de verificación y evaluación adoptados por una entidad","La función de auditoría externa que realizan las contralorías sobre la gestión fiscal","El control previo que la oficina de control interno ejerce sobre cada acto administrativo antes de su firma","La facultad disciplinaria del jefe de la entidad sobre sus subalternos"],
e:"Art. 1 de la Ley 87. El control interno no es control previo ni coadministración; tampoco equivale al control fiscal externo.",f:"Ley 87/1993, art. 1"},
{tm:"T3",t:1,q:"¿Cuál de los siguientes NO es un rol de las oficinas de control interno según el Decreto 648 de 2017?",
o:["Coadministrar y aprobar previamente los actos de gestión de los procesos","Liderazgo estratégico","Evaluación de la gestión del riesgo","Relación con entes externos de control"],
e:"Los roles son: liderazgo estratégico, enfoque hacia la prevención, evaluación de la gestión del riesgo, evaluación y seguimiento, y relación con entes externos de control. La OCI no coadministra, para preservar su independencia.",f:"Dec. 1083/2015, art. 2.2.21.5.3 (Dec. 648/2017)"},
{tm:"T3",t:2,q:"Sobre los principios del control interno tradicionalmente asociados al MECI:",
s:["El autocontrol es la capacidad de cada servidor de evaluar y controlar su propio trabajo.","La autorregulación es la capacidad de la entidad para desarrollar internamente métodos y normas que regulen su gestión.","La autogestión es la capacidad de interpretar, coordinar y aplicar de manera efectiva la función administrativa asignada.","El autocontrol es una responsabilidad exclusiva de la Oficina de Control Interno."],a:0,
e:"Las tres primeras son correctas. El autocontrol corresponde a todos los servidores; la Oficina de Control Interno lo fomenta pero no lo concentra.",f:"MECI – principios"},
{tm:"T3",t:1,q:"En la Personería de Bogotá, la secretaría técnica del Comité Institucional de Gestión y Desempeño corresponde a:",
o:["La Dirección de Planeación","La Oficina de Control Interno","La Subdirección de Desarrollo del Talento Humano","La Personería Auxiliar"],
e:"Acuerdo 978 de 2025, art. 40 num. 11. A Planeación también le corresponde dirigir la implementación del modelo de planeación y de los sistemas de gestión (num. 5).",f:"Acuerdo 978/2025, art. 40"},
{tm:"T3",t:3,af:"Los informes de la Oficina de Control Interno sustituyen la responsabilidad de los líderes de proceso de identificar y controlar sus riesgos.",
rz:"En el esquema de líneas de defensa, la Oficina de Control Interno realiza una evaluación independiente y objetiva.",a:3,
e:"La gestión del riesgo es de la primera línea (líderes de proceso). La OCI evalúa de forma independiente, sin sustituir a nadie. Afirmación falsa, razón verdadera.",f:"MECI – líneas de defensa"},

/* ───────── T4 · Plan Estratégico Institucional 2024-2028 ───────── */
{tm:"T4",t:1,q:"El PEI 2024-2028 de la Personería se articula con el Plan Distrital de Desarrollo denominado:",
o:["«Bogotá Camina Segura»","«Bogotá Mejor para Todos»","«Un Nuevo Contrato Social y Ambiental para la Bogotá del Siglo XXI»","«Bogotá Humana»"],
e:"El Plan Distrital de Desarrollo 2024-2028 es «Bogotá Camina Segura». Los proyectos de inversión de la Personería aparecen reportados en él.",f:"PDD 2024-2028; SDP, reporte de inversión"},
{tm:"T4",t:2,q:"Sobre los objetivos estratégicos y de calidad de la Personería (PEI 2024-2028 / Acuerdo 978, art. 3):",
s:["Fortalecer la promoción de derechos, la prevención y control a la función pública con enfoque territorial, diferencial e intersectorial, y la potestad disciplinaria.","Promover la participación ciudadana y la articulación interinstitucional para la protección de los derechos y el interés general.","Fomentar una cultura de gestión del conocimiento, la innovación y la investigación como instrumentos transversales.","Maximizar el recaudo de multas disciplinarias como fuente de financiación de la entidad."],a:0,
e:"Los objetivos 1, 2 y 3 son textuales; el cuarto objetivo real es fortalecer las capacidades institucionales mediante la modernización y la transformación tecnológica.",f:"Acuerdo 978/2025, art. 3; personeriabogota.gov.co"},
{tm:"T4",t:1,q:"¿Cuántos objetivos estratégicos y de calidad tiene la Personería de Bogotá según su plataforma estratégica vigente?",
o:["Cuatro","Tres","Cinco","Siete"],
e:"Son cuatro: promoción de derechos y control; participación y articulación; gestión del conocimiento e innovación; modernización y transformación tecnológica.",f:"Acuerdo 978/2025, art. 3"},
{tm:"T4",t:1,q:"Según el PEI 2024-2028, ¿qué proyecto de inversión busca modernizar la infraestructura física de los espacios de la entidad para prestar los servicios en condiciones adecuadas para funcionarios y usuarios?",
o:["8199 – Modernización institucional de la Personería de Bogotá","8201 – Fortalecimiento de la gestión de la potestad disciplinaria","8209 – Fortalecimiento del ejercicio de protección de los derechos humanos y el DIH","8181 – Atención integral a la primera infancia"],
e:"El PEI describe así el proyecto de Modernización institucional (8199 en el reporte de la SDP). El PEI despliega cuatro proyectos: potestad disciplinaria (8201), prevención y control a la función pública, protección de DD.HH. y DIH (8209) y modernización institucional.",f:"PEI 01-PL-012 v4, num. 6.5; SDP, reporte de inversión"},
{tm:"T4",t:3,af:"El PEI 2024-2028 de la Personería debe articularse con el Plan Distrital de Desarrollo.",
rz:"La Personería, como organismo de control, carece de autonomía administrativa y presupuestal.",a:2,
e:"La articulación con el PDD es cierta: los proyectos de inversión se inscriben ante la Secretaría Distrital de Planeación. Pero la razón es falsa: los arts. 5 y 6 del Acuerdo 978 reconocen autonomía administrativa y presupuestal.",f:"Acuerdo 978/2025, arts. 5, 6 y 40"},
{tm:"T4",t:1,q:"Según la misión institucional, la Personería actúa de manera:",
o:["Oportuna y resolutiva para garantizar el respeto de los derechos fundamentales","Preventiva y sancionatoria para garantizar el recaudo fiscal","Subsidiaria y residual frente a la Procuraduría General","Concurrente y supletiva frente a la Administración Distrital"],
e:"Misión (Acuerdo 978, art. 2): ejerce funciones de Ministerio Público, defensor de DD.HH. que vigila la conducta de los servidores, actuando de manera oportuna y resolutiva.",f:"Acuerdo 978/2025, art. 2"},
{tm:"T4",t:1,q:"¿Qué dependencia dirige la formulación, adopción y ejecución de la plataforma estratégica, táctica y operativa de la Personería?",
o:["La Dirección de Planeación","La Oficina de Control Interno","La Dirección de Gestión del Conocimiento, Analítica e Innovación","La Oficina de Relaciones Nacionales e Internacionales"],
e:"Acuerdo 978 de 2025, art. 40 num. 1. Control Interno evalúa de manera independiente; Conocimiento e Innovación analiza datos y promueve investigación.",f:"Acuerdo 978/2025, art. 40"},
{tm:"T4",t:2,q:"Sobre la planeación institucional en entidades públicas:",
s:["El PEI de la Personería se adopta mediante acuerdo del Concejo de Bogotá.","El Plan de Acción Institucional despliega anualmente los objetivos del plan estratégico.","El Decreto 612 de 2018 fija el 31 de marzo como fecha límite para publicar el plan de acción.","El Decreto 612 de 2018 ordena integrar los planes institucionales y estratégicos al plan de acción y publicarlo en la web a más tardar el 31 de enero."],a:2,
e:"Verdaderas 2 y 4. El PEI lo adopta la propia entidad, no el Concejo, y el plazo de publicación del Decreto 612 es el 31 de enero.",f:"Dec. 1083/2015, arts. 2.2.22.3.14 y 2.2.22.3.15 (Dec. 612/2018)"},
{tm:"T4",t:1,q:"El cuarto objetivo estratégico de la Personería apunta a:",
o:["Fortalecer las capacidades institucionales a través de la modernización y la transformación tecnológica","Ampliar la planta de personal mediante la creación de nuevas delegadas","Asumir funciones de control fiscal sobre las entidades distritales","Fortalecer la representación judicial del Distrito en procesos contenciosos"],
e:"Objetivo 4: modernización y transformación tecnológica. Las otras opciones no hacen parte de la plataforma estratégica; el control fiscal corresponde a la Contraloría.",f:"Acuerdo 978/2025, art. 3"},

/* ───────── T5 · Sistema de Gestión Ambiental ───────── */
{tm:"T5",t:1,q:"El instrumento mediante el cual las entidades distritales, incluida la Personería, planean e implementan su gestión ambiental interna es:",
o:["El Plan Institucional de Gestión Ambiental (PIGA)","El Plan de Ordenamiento Territorial (POT)","El Plan de Gestión Integral de Residuos Sólidos (PGIRS)","El Plan de Manejo Ambiental de proyectos de infraestructura"],
e:"El PIGA es el instrumento de planeación ambiental institucional de las entidades distritales y se articula con el Plan de Gestión Ambiental del Distrito.",f:"Dec. Distrital 456/2008; Res. SDA 242/2014"},
{tm:"T5",t:1,q:"En términos de ISO 14001, el consumo de energía eléctrica en las sedes de la Personería es:",
o:["Un aspecto ambiental","Un impacto ambiental","Un requisito legal","Un objetivo ambiental"],
e:"El aspecto es el elemento de las actividades que interactúa con el ambiente (el consumo); el impacto es el cambio que resulta (agotamiento de recursos, emisiones).",f:"NTC-ISO 14001:2015, 3.2"},
{tm:"T5",t:1,q:"Según el código nacional de colores (Res. 2184 de 2019), el papel limpio y seco, el plástico, el vidrio y los metales se depositan en la bolsa o recipiente de color:",
o:["Blanco","Negro","Verde","Rojo"],
e:"Blanco: aprovechables. Negro: no aprovechables. Verde: orgánicos aprovechables.",f:"Res. 2184/2019 MinAmbiente"},
{tm:"T5",t:2,q:"Sobre los programas que integran el PIGA de las entidades distritales:",
s:["Uso eficiente del agua.","Licenciamiento ambiental de proyectos de infraestructura.","Gestión integral de residuos.","Expedición de permisos de vertimiento a terceros."],a:1,
e:"Los programas del PIGA incluyen uso eficiente del agua, uso eficiente de la energía, gestión integral de residuos, consumo sostenible e implementación de prácticas sostenibles. El licenciamiento y los permisos son funciones de autoridad ambiental.",f:"Res. SDA 242/2014"},
{tm:"T5",t:1,q:"En el informe de la política «Componente Ambiental» de la Medición del Desempeño Institucional 2024, la Personería de Bogotá obtuvo:",
o:["Nivel ALTO, con 91,79 %","Nivel MEDIO, con 63,69 %","Nivel ALTO, con 93,59 %","Nivel BAJO, por debajo de 50 %"],
e:"El informe de la Secretaría General registra a la Personería con 91,79 % (ALTO). El 93,59 % corresponde a la Contraloría de Bogotá y el 63,69 % a otra entidad.",f:"Secretaría General, Informe Política MDI 2024 Componente Ambiental"},
{tm:"T5",t:1,q:"La figura del gestor ambiental en las entidades distritales, responsable de liderar el PIGA, fue creada por:",
o:["El Acuerdo Distrital 333 de 2008","La Ley 99 de 1993","El Decreto 1499 de 2017","El Acuerdo Distrital 978 de 2025"],
e:"El Acuerdo 333 de 2008 del Concejo creó la figura del gestor ambiental en las entidades distritales.",f:"Acuerdo Distrital 333/2008"},
{tm:"T5",t:3,af:"Un sistema de gestión ambiental basado en ISO 14001 se estructura sobre el ciclo PHVA (planificar, hacer, verificar, actuar).",
rz:"La norma exige que la política ambiental incluya compromisos de protección del ambiente, de cumplimiento de requisitos legales y de mejora continua.",a:1,
e:"Ambas son verdaderas, pero el contenido mínimo de la política ambiental no explica por qué la norma se estructura en el ciclo PHVA.",f:"NTC-ISO 14001:2015"},
{tm:"T5",t:1,q:"El PIGA de cada entidad se articula con el Plan de Gestión Ambiental del Distrito, reformado por:",
o:["El Decreto Distrital 456 de 2008","El Decreto Ley 1421 de 1993","La Ley 1712 de 2014","El Acuerdo Distrital 257 de 2006"],
e:"El Decreto 456 de 2008 reformó el Plan de Gestión Ambiental del Distrito Capital, del que se desprenden los PIGA institucionales.",f:"Dec. Distrital 456/2008"},
{tm:"T5",t:3,af:"La política ambiental de una entidad debe ser apropiada a su propósito y contexto y servir de marco para fijar objetivos ambientales.",
rz:"En un SGA la política ambiental la aprueba la autoridad ambiental competente mediante licencia.",a:2,
e:"La política la establece la alta dirección de la propia organización (ISO 14001, 5.2); no la aprueba una autoridad ambiental por licencia.",f:"NTC-ISO 14001:2015, 5.2"},
{tm:"T5",t:1,q:"Según la política ambiental de la Personería de Bogotá, ¿quiénes son corresponsables de incorporar prácticas que protejan el ambiente?",
o:["La entidad y sus servidores","Únicamente el gestor ambiental de la entidad","Únicamente la Dirección Administrativa y Financiera","La Secretaría Distrital de Ambiente, como autoridad ambiental"],
e:"La política ambiental publicada en la intranet señala que la entidad y sus servidores son corresponsables de incorporar prácticas protectoras del ambiente. El gestor ambiental lidera el PIGA, pero no concentra la responsabilidad.",f:"Intranet Personería – Sistema de Gestión Ambiental (SGA)"},
{tm:"T5",t:2,q:"Sobre los compromisos de la política ambiental de la Personería de Bogotá:",
s:["Se limita al cumplimiento legal, sin compromiso de mejora continua.","Incluye desarrollar competencias para el consumo responsable y la ecoeficiencia.","Es independiente de la misión, la visión y los objetivos institucionales.","Incluye prevenir la contaminación."],a:2,
e:"Los compromisos de la política son: cumplir la normatividad ambiental, identificar aspectos e impactos, buscar la mejora continua, desarrollar competencias para el consumo responsable y la ecoeficiencia, prevenir la contaminación y alinearse con la misión, la visión y los objetivos institucionales. Son verdaderas la 2 y la 4.",f:"Intranet Personería – Sistema de Gestión Ambiental (SGA)"},
{tm:"T5",t:3,af:"El Sistema de Gestión Ambiental de la Personería de Bogotá se basa en la norma ISO 14001.",
rz:"El SGA busca controlar las actividades, servicios y productos de la entidad que pueden afectar el ambiente y reducir sus impactos de forma continua.",a:1,
e:"Ambas son verdaderas según la intranet. Pero la finalidad de controlar y reducir impactos no explica por qué se eligió la ISO 14001 como referente; es el propósito de cualquier SGA.",f:"Intranet Personería – Sistema de Gestión Ambiental (SGA)"},

/* ───────── T6 · Manual Específico de Funciones (Res. 1567-10000-2026 / 08-MN-001) ───────── */
{tm:"T6",t:1,q:"La versión del Manual Específico de Funciones y de Competencias Laborales publicada en 2026 por la Personería se identifica con:",
o:["Código 08-MN-001, versión 14, vigente desde el 4 de mayo de 2026","Código 08-MN-01, versión 12, vigente desde el 31 de enero de 2024","Código 01-PL-012, versión 4, vigente desde el 29 de enero de 2026","Código 03-PL-01, versión 6, vigente desde enero de 2026"],
e:"Las fichas del manual 2026 llevan código 08-MN-001, versión 14, vigente desde el 04/05/2026 (994 páginas). La versión 12 (08-MN-01) regía desde el 31/01/2024. 01-PL-012 es el PEI y 03-PL-01 el PETI.",f:"Manual 08-MN-001 v14; manual 08-MN-01 v12"},
{tm:"T6",t:1,q:"¿Cuál de las siguientes NO es una competencia comportamental COMÚN a todos los servidores públicos según el Decreto 815 de 2018?",
o:["Aporte técnico-profesional","Aprendizaje continuo","Orientación al usuario y al ciudadano","Adaptación al cambio"],
e:"Las comunes son: aprendizaje continuo, orientación a resultados, orientación al usuario y al ciudadano, compromiso con la organización, trabajo en equipo y adaptación al cambio. El aporte técnico-profesional es del nivel profesional.",f:"Dec. 1083/2015, art. 2.2.4.7 (Dec. 815/2018)"},
{tm:"T6",t:2,q:"Sobre las competencias comportamentales por nivel (Decreto 815 de 2018):",
s:["Relaciones interpersonales es una competencia del nivel profesional.","Instrumentación de decisiones es una competencia del nivel profesional.","Colaboración es una competencia del nivel profesional.","Para profesionales con personal a cargo se agregan dirección y desarrollo de personal, y toma de decisiones."],a:2,
e:"Nivel profesional: aporte técnico-profesional, comunicación efectiva, gestión de procedimientos e instrumentación de decisiones; con personal a cargo se suman dirección y desarrollo de personal y toma de decisiones. Relaciones interpersonales y colaboración son del nivel asistencial.",f:"Dec. 1083/2015, art. 2.2.4.8"},
{tm:"T6",t:1,q:"¿Cuál de las siguientes denominaciones NO es un nivel jerárquico de los empleos territoriales según el Decreto 785 de 2005?",
o:["Ejecutivo","Asesor","Profesional","Asistencial"],
e:"Los niveles son directivo, asesor, profesional, técnico y asistencial. El «ejecutivo» existió en regímenes anteriores.",f:"Dec. Ley 785/2005, art. 3"},
{tm:"T6",t:1,q:"Según la nomenclatura del Decreto 785 de 2005, el empleo de Profesional Especializado se identifica con el código:",
o:["222","219","314","407"],
e:"222: profesional especializado; 219: profesional universitario; 314: técnico operativo; 407: auxiliar administrativo.",f:"Dec. Ley 785/2005, art. 20"},
{tm:"T6",t:3,af:"El Manual Específico de Funciones de la Personería puede ser actualizado mediante resolución del jefe de la entidad.",
rz:"Las funciones de los empleos de la Personería están fijadas directamente en la Constitución Política.",a:2,
e:"El manual se adopta y modifica por acto administrativo del jefe de la entidad, como ocurrió con la Resolución 1567-10000-2026. Las funciones de los empleos no están en la Constitución; el art. 122 exige que estén detalladas en ley o reglamento.",f:"CP art. 122; Dec. Ley 785/2005, art. 32"},
{tm:"T6",t:1,q:"¿Qué elemento de la ficha de un empleo describe, en una sola frase, la razón de ser del cargo?",
o:["El propósito principal","Los conocimientos básicos o esenciales","Las equivalencias entre estudios y experiencia","Las competencias comportamentales"],
e:"El propósito principal expresa la razón de ser del empleo; las funciones esenciales lo desarrollan.",f:"Guía DAFP de manuales de funciones"},
{tm:"T6",t:2,q:"Sobre la Resolución 1567-10000-2026 y el contenido del manual:",
s:["Actualiza el Manual Específico de Funciones y de Competencias Laborales de los empleos de la planta de la Personería.","Fue expedida por el Departamento Administrativo del Servicio Civil Distrital.","Cada ficha describe funciones esenciales, conocimientos básicos, competencias y requisitos de estudio y experiencia.","El manual crea empleos y fija su asignación básica mensual."],a:1,
e:"Verdaderas 1 y 3. La expide la propia Personería; el DASCD emite conceptos técnicos. Crear empleos y fijar la escala corresponde al Concejo (como hizo el Acuerdo 978), no al manual.",f:"Anexo técnico del concurso; Acuerdo 978/2025"},

/* ───────── T7 · Labores y responsabilidades del nivel profesional y asistencial ───────── */
{tm:"T7",t:1,q:"Según el Decreto 785 de 2005, el nivel profesional agrupa los empleos cuya naturaleza demanda:",
o:["La ejecución y aplicación de los conocimientos propios de una carrera profesional reconocida por la ley, a los que según su complejidad pueden corresponder funciones de coordinación, supervisión y control de áreas internas","Asistir, aconsejar y asesorar directamente a los empleados de la alta dirección","Actividades de apoyo y complementarias de las tareas de los niveles superiores","El desarrollo de procesos y procedimientos en labores técnicas misionales y de apoyo"],
e:"Es la definición del nivel profesional (art. 4). La segunda corresponde al nivel asesor, la tercera al asistencial y la cuarta al técnico.",f:"Dec. Ley 785/2005, art. 4"},
{tm:"T7",t:1,q:"El nivel asistencial comprende los empleos cuyas funciones implican:",
o:["Actividades de apoyo y complementarias de las tareas propias de los niveles superiores o labores de predominio manual o simple ejecución","Formulación de políticas institucionales y adopción de planes","Aplicación de conocimientos de una carrera profesional con funciones de coordinación","Asesoría directa a la alta dirección territorial"],
e:"Definición del nivel asistencial del Decreto 785 de 2005.",f:"Dec. Ley 785/2005, art. 4"},
{tm:"T7",t:3,af:"Un profesional especializado de la Personería puede, según la complejidad del empleo, ejercer funciones de coordinación y supervisión de grupos internos.",
rz:"El Decreto 785 de 2005 prevé que a los empleos del nivel profesional les pueden corresponder funciones de coordinación, supervisión y control de áreas internas.",a:0,
e:"La razón es precisamente el fundamento normativo de la afirmación.",f:"Dec. Ley 785/2005, art. 4"},
{tm:"T7",t:1,q:"Como agente del Ministerio Público en una audiencia de proceso verbal abreviado ante un inspector de policía, usted advierte que no se ha permitido al presunto infractor presentar descargos. Lo procedente es:",
o:["Intervenir solicitando que se garantice el derecho de defensa y el debido proceso, dejar constancia y, si la irregularidad persiste, dar traslado a la autoridad disciplinaria","Asumir la dirección de la audiencia y conceder directamente el uso de la palabra","Declarar la nulidad de lo actuado por violación del debido proceso","Abstenerse de intervenir, porque el Ministerio Público solo actúa en procesos judiciales"],
e:"El Ministerio Público interviene para la defensa del orden jurídico y las garantías fundamentales (DL 1421, art. 99 num. 2; Acuerdo 978, art. 39), pero no dirige la audiencia ni decreta nulidades. El art. 223 de la Ley 1801 prevé los descargos en el proceso verbal abreviado.",f:"CP art. 29; Ley 1801/2016, art. 223; Acuerdo 978/2025, art. 39"},
{tm:"T7",t:1,q:"Una ciudadana presenta verbalmente una petición en la ventanilla de atención. El servidor asistencial que la atiende debe:",
o:["Recibirla, dejar constancia y darle trámite, pues la petición verbal es válida","Exigirle que la presente por escrito como requisito de admisión","Negarse a recibirla si no cita la norma que consagra su derecho","Recibirla solo si aporta un apoderado abogado"],
e:"Las peticiones pueden presentarse verbalmente, por escrito o por cualquier medio idóneo (Ley 1755, art. 15). No se exige abogado ni citar normas, y la falta de fundamentación no permite rechazarla.",f:"Ley 1437/2011, arts. 15-16 (Ley 1755/2015)"},
{tm:"T7",t:2,q:"Sobre los deberes de todo servidor público (Ley 1952 de 2019, art. 38):",
s:["Cumplir y hacer cumplir los deberes contenidos en la Constitución, los tratados de DD.HH. y DIH, las leyes y los reglamentos.","Puede usar los bienes de la entidad para fines particulares si los restituye en buen estado.","Dedicar la totalidad del tiempo reglamentario de trabajo al desempeño de las funciones encomendadas.","Puede delegar en contratistas funciones de dirección y decisión propias del empleo."],a:1,
e:"Verdaderas 1 y 3. Los bienes deben usarse exclusivamente para las funciones del cargo, y la delegación de funciones de decisión en contratistas está proscrita.",f:"Ley 1952/2019, art. 38"},
{tm:"T7",t:1,q:"Una profesional elabora un concepto jurídico técnicamente sustentado, con alternativas y riesgos, que permite a su jefe decidir. ¿Qué competencia comportamental del nivel profesional se evidencia principalmente?",
o:["Aporte técnico-profesional","Manejo de la información","Visión estratégica","Confiabilidad técnica"],
e:"Aporte técnico-profesional es poner a disposición de la entidad saberes técnicos para resolver asuntos complejos. Manejo de la información es del nivel asistencial; visión estratégica, del directivo; confiabilidad técnica, del asesor.",f:"Dec. 1083/2015, art. 2.2.4.8"},
{tm:"T7",t:3,af:"El nivel asistencial puede apoyar el manejo de expedientes y la radicación de comunicaciones de la dependencia.",
rz:"Al nivel asistencial le corresponde adoptar las decisiones de fondo en las actuaciones misionales de la dependencia.",a:2,
e:"El nivel asistencial cumple funciones de apoyo y complementarias. Las decisiones de fondo corresponden a niveles directivos o a quienes tengan la competencia asignada.",f:"Dec. Ley 785/2005, art. 4"}
];

/* Banco de preguntas — Parte 2: función pública, petición, datos, transparencia, anticorrupción, integridad, archivo */
const Q2 = [
/* ───────── T8 · Principios constitucionales, derechos fundamentales y función pública ───────── */
{tm:"T8",t:1,q:"¿Cuál de los siguientes NO figura entre los principios de la función administrativa enunciados en el artículo 209 de la Constitución?",
o:["Progresividad","Moralidad","Celeridad","Publicidad"],
e:"El art. 209 enumera igualdad, moralidad, eficacia, economía, celeridad, imparcialidad y publicidad. La progresividad es un principio de los derechos sociales, no del art. 209.",f:"CP art. 209"},
{tm:"T8",t:1,q:"Según el artículo 6 de la Constitución, los servidores públicos son responsables:",
o:["Por infringir la Constitución y las leyes, y por omisión o extralimitación en el ejercicio de sus funciones","Únicamente por infringir la Constitución y las leyes, igual que los particulares","Solo por las conductas dolosas que causen daño patrimonial al Estado","Por las omisiones, pero no por la extralimitación cuando actúan de buena fe"],
e:"Los particulares responden solo por infringir la Constitución y las leyes; los servidores responden además por omisión o extralimitación.",f:"CP art. 6"},
{tm:"T8",t:1,q:"Según el artículo 125 de la Constitución, los empleos son de carrera, SALVO los siguientes. ¿Cuál NO es una excepción constitucional a la carrera?",
o:["Los empleos provistos mediante nombramiento provisional","Los de elección popular","Los de libre nombramiento y remoción","Los de trabajadores oficiales"],
e:"La provisionalidad es una forma transitoria de proveer un empleo que sigue siendo de carrera; no es una excepción. Las excepciones son los empleos de elección popular, libre nombramiento y remoción, trabajadores oficiales y los demás que determine la ley.",f:"CP art. 125"},
{tm:"T8",t:2,q:"Sobre los derechos de aplicación inmediata enumerados en el artículo 85 de la Constitución:",
s:["El derecho de petición (art. 23) es de aplicación inmediata.","El derecho a la vivienda digna (art. 51) está enumerado como de aplicación inmediata.","El debido proceso (art. 29) es de aplicación inmediata.","El derecho a la recreación (art. 52) está enumerado como de aplicación inmediata."],a:1,
e:"El art. 85 incluye, entre otros, los arts. 11 a 21, 23, 24, 26 a 31, 33, 34, 37 y 40. Los arts. 51 y 52 no están en ese listado. Verdaderas 1 y 3.",f:"CP art. 85"},
{tm:"T8",t:3,af:"La acción de tutela puede proceder contra particulares encargados de la prestación de un servicio público.",
rz:"El artículo 86 de la Constitución defiere a la ley establecer los casos de tutela contra particulares que presten servicios públicos, cuya conducta afecte grave y directamente el interés colectivo, o respecto de quienes el solicitante esté en subordinación o indefensión.",a:0,
e:"La razón es el fundamento constitucional de la afirmación (desarrollado por el art. 42 del Decreto 2591 de 1991).",f:"CP art. 86; Dec. 2591/1991, art. 42"},
{tm:"T8",t:1,q:"Notificado el fallo de primera instancia en una acción de tutela, el término para impugnarlo es:",
o:["Tres días siguientes a su notificación","Cinco días siguientes a su notificación","Diez días hábiles siguientes a su notificación","Un mes, contado desde la ejecutoria"],
e:"El art. 31 del Decreto 2591 fija tres días. El juez dispone de diez días para fallar desde la solicitud (art. 29).",f:"Dec. 2591/1991, arts. 29 y 31"},
{tm:"T8",t:1,q:"El artículo 122 de la Constitución establece que ningún servidor público entrará a ejercer su cargo sin:",
o:["Prestar juramento de cumplir y defender la Constitución y desempeñar los deberes que le incumben","Haber superado un concurso público de méritos","Contar con aprobación previa de la Procuraduría","Presentar certificado de antecedentes fiscales de los últimos diez años"],
e:"Art. 122: juramento de cumplir y defender la Constitución. El mismo artículo exige que todo empleo tenga funciones detalladas en ley o reglamento.",f:"CP art. 122"},
{tm:"T8",t:1,q:"Según el artículo 118 de la Constitución, el Ministerio Público lo ejercen las siguientes autoridades, EXCEPTO:",
o:["El Contralor General de la República","El Procurador General de la Nación","El Defensor del Pueblo","Los personeros municipales"],
e:"El art. 118 menciona al Procurador, al Defensor del Pueblo, a procuradores delegados, agentes del Ministerio Público ante autoridades jurisdiccionales, personeros municipales y demás funcionarios que determine la ley. La Contraloría ejerce control fiscal.",f:"CP art. 118"},
{tm:"T8",t:3,af:"Los personeros pueden interponer la acción de tutela.",
rz:"El artículo 49 del Decreto 2591 de 1991 permite al personero, por delegación expresa del Defensor del Pueblo, interponer tutelas o representarlo en las que este interponga.",a:1,
e:"Ambas son ciertas, pero la legitimación propia del personero viene del art. 10 del Decreto 2591 (y del art. 99 DL 1421), no de la delegación del art. 49, que es una hipótesis adicional. La razón no explica la afirmación.",f:"Dec. 2591/1991, arts. 10 y 49"},
{tm:"T8",t:1,q:"Según el artículo 123 de la Constitución, son servidores públicos:",
o:["Los miembros de las corporaciones públicas, los empleados y trabajadores del Estado y de sus entidades descentralizadas territorialmente y por servicios","Solo los empleados públicos de carrera administrativa","Los contratistas de prestación de servicios que ejerzan funciones permanentes","Los particulares que ejerzan funciones públicas de manera transitoria"],
e:"Esa es la definición del art. 123. Los contratistas no son servidores públicos, aunque los particulares que ejercen funciones públicas responden en los términos de la ley.",f:"CP art. 123"},

/* ───────── T9 · Derecho de petición y atención a la ciudadanía ───────── */
{tm:"T9",t:1,q:"Salvo norma especial, el término general para resolver una petición es:",
o:["Quince días hábiles siguientes a su recepción","Diez días hábiles siguientes a su recepción","Treinta días hábiles siguientes a su recepción","Quince días calendario siguientes a su radicación"],
e:"Art. 14 CPACA (Ley 1755): regla general de 15 días; 10 días para documentos e información; 30 días para consultas.",f:"Ley 1437/2011, art. 14 (Ley 1755/2015)"},
{tm:"T9",t:1,q:"Si una autoridad no responde dentro del término una petición de documentos, ¿qué consecuencia prevé la ley?",
o:["Se entiende aceptada y las copias deben entregarse dentro de los tres días siguientes","Se configura silencio negativo y el peticionario debe acudir a la jurisdicción","Se prorroga automáticamente el término por diez días más","Se archiva la petición por desistimiento tácito"],
e:"Art. 14 num. 1: si no hay respuesta en diez días, la solicitud se entiende aceptada y la administración no puede negar la entrega; las copias se entregan dentro de los tres días siguientes.",f:"Ley 1437/2011, art. 14"},
{tm:"T9",t:1,q:"Las peticiones mediante las cuales se eleva una consulta a una autoridad en relación con las materias a su cargo deben resolverse dentro de:",
o:["Treinta días siguientes a su recepción","Quince días siguientes a su recepción","Diez días siguientes a su recepción","Cuarenta y cinco días siguientes a su recepción"],
e:"Art. 14 num. 2 CPACA: 30 días para consultas.",f:"Ley 1437/2011, art. 14"},
{tm:"T9",t:2,q:"Sobre el trámite del derecho de petición (Ley 1755 de 2015):",
s:["La autoridad puede exigir en todos los casos que la petición se presente por escrito.","El peticionario debe citar la norma que consagra su derecho como requisito de admisión.","Las peticiones de documentos se resuelven en quince días.","Si la autoridad no es competente, informa al peticionario y remite la petición al competente dentro de los cinco días siguientes al recibo, si es escrita."],a:3,
e:"Solo la 4 es verdadera (art. 21). La petición puede ser verbal; no se exige citar normas; las de documentos se resuelven en 10 días.",f:"Ley 1437/2011, arts. 14, 15 y 21"},
{tm:"T9",t:3,af:"La autoridad puede negarse a recibir una petición por estar incompleta o mal fundamentada.",
rz:"El CPACA dispone que en ningún caso podrá ser rechazada una petición por motivos de fundamentación inadecuada o incompleta.",a:3,
e:"La afirmación es falsa: si está incompleta se requiere al peticionario (art. 17), pero no se rechaza (arts. 15-16). La razón es verdadera.",f:"Ley 1437/2011, arts. 15-17"},
{tm:"T9",t:1,q:"Cuando la autoridad requiere al peticionario para completar su solicitud y este no lo hace, se entiende que desistió si no satisface el requerimiento dentro de:",
o:["Un mes, prorrogable por un término igual a solicitud del interesado","Diez días hábiles improrrogables","Quince días hábiles, prorrogables por cinco más","Dos meses improrrogables"],
e:"Art. 17 CPACA: un mes, prorrogable hasta por igual término. El desistimiento se decreta por acto motivado contra el cual solo procede reposición.",f:"Ley 1437/2011, art. 17"},
{tm:"T9",t:1,q:"Una entidad del Distrito Capital niega una solicitud de documentos invocando reserva y el peticionario insiste. ¿A quién se envía la documentación para que decida?",
o:["Al Tribunal Administrativo con jurisdicción donde se encuentren los documentos, que decide en única instancia dentro de los diez días siguientes","Al juez administrativo del circuito, que decide en dos instancias","A la Personería de Bogotá, que resuelve la insistencia","A la Procuraduría General de la Nación, como garante de la Ley 1712"],
e:"Art. 26 CPACA: si la autoridad es nacional, departamental o del Distrito Capital, decide el Tribunal Administrativo; si es distrital o municipal distinta, el juez administrativo. Decide en única instancia dentro de diez días.",f:"Ley 1437/2011, art. 26"},
{tm:"T9",t:2,q:"Sobre reglas especiales del derecho de petición:",
s:["Las autoridades dan atención prioritaria a peticiones de reconocimiento de un derecho fundamental cuando deban resolverse para evitar un perjuicio irremediable.","Las peticiones de periodistas para el ejercicio de su actividad se tramitan preferencialmente.","Toda petición debe ser respetuosa; las irrespetuosas pueden rechazarse.","Frente a peticiones reiterativas ya resueltas, la autoridad nunca puede remitirse a las respuestas anteriores."],a:0,
e:"Verdaderas 1, 2 y 3 (arts. 19 y 20). La autoridad sí puede remitirse a respuestas anteriores en peticiones reiterativas, salvo que se trate de derechos imprescriptibles o se hayan subsanado los requisitos (art. 19).",f:"Ley 1437/2011, arts. 19-20"},
{tm:"T9",t:1,q:"Según el Acuerdo 978 de 2025, ¿qué dependencia verifica que se cumplan los términos del derecho de petición mediante seguimiento ante terceros?",
o:["La Dirección para la Orientación y Asistencia a las Personas","La Oficina Asesora Jurídica","La Dirección de Gestión del Conocimiento, Analítica e Innovación","La Personería Delegada para la Segunda Instancia"],
e:"Art. 13 nums. 4 a 6: esta Dirección lidera el seguimiento a peticiones y verifica el cumplimiento de términos ante terceros.",f:"Acuerdo 978/2025, art. 13"},
{tm:"T9",t:3,af:"Puede presentarse un derecho de petición ante una organización privada para garantizar derechos fundamentales.",
rz:"La Ley 1755 de 2015 regula el derecho de petición ante organizaciones e instituciones privadas, con o sin personería jurídica.",a:0,
e:"Arts. 32 y 33 del CPACA (Ley 1755). La razón explica la afirmación.",f:"Ley 1437/2011, art. 32"},

/* ───────── T10 · Hábeas data y protección de datos personales ───────── */
{tm:"T10",t:1,q:"¿Cuál de los siguientes es un dato SENSIBLE según la Ley 1581 de 2012?",
o:["La huella dactilar registrada en un sistema biométrico de control de acceso","El cargo y la dependencia en que labora un servidor público","La dirección de correo electrónico institucional de una dependencia","La fecha de expedición de un acto administrativo publicado"],
e:"Los datos biométricos son sensibles (art. 5). Los demás son datos públicos o semiprivados relacionados con el ejercicio de funciones o con actos publicados.",f:"Ley 1581/2012, art. 5"},
{tm:"T10",t:1,q:"Según la Ley 1581 de 2012, no se requiere autorización del titular cuando:",
o:["La información es requerida por una entidad pública en ejercicio de sus funciones legales o por orden judicial","Se trata de datos sensibles de salud que se usarán con fines comerciales","El responsable desea compartir la base de datos con un aliado privado","El dato se recolectó en un evento institucional y se quiere usar para publicidad"],
e:"El art. 10 exceptúa la autorización en casos como requerimiento de entidad pública en ejercicio de funciones o por orden judicial, datos públicos, urgencia médica, fines históricos o estadísticos autorizados y datos del registro civil.",f:"Ley 1581/2012, art. 10"},
{tm:"T10",t:2,q:"Sobre los principios del tratamiento de datos personales (art. 4, Ley 1581):",
s:["Principio de rentabilidad.","Principio de acceso y circulación restringida.","Principio de publicidad irrestricta de las bases de datos.","Principio de confidencialidad."],a:2,
e:"Los principios son: legalidad, finalidad, libertad, veracidad o calidad, transparencia, acceso y circulación restringida, seguridad y confidencialidad. Verdaderas 2 y 4.",f:"Ley 1581/2012, art. 4"},
{tm:"T10",t:1,q:"La autoridad de protección de datos personales en Colombia es:",
o:["La Superintendencia de Industria y Comercio, a través de la Delegatura para la Protección de Datos Personales","La Procuraduría General de la Nación","El Ministerio de Tecnologías de la Información y las Comunicaciones","La Agencia Nacional Digital"],
e:"Art. 19 de la Ley 1581: la SIC ejerce la vigilancia mediante una Delegatura para la Protección de Datos Personales.",f:"Ley 1581/2012, art. 19"},
{tm:"T10",t:1,q:"Un titular presenta un reclamo para corregir sus datos ante el responsable. El término máximo para atenderlo es:",
o:["Quince días hábiles, prorrogables hasta ocho días hábiles más","Diez días hábiles, prorrogables hasta cinco días hábiles más","Treinta días calendario, improrrogables","Quince días calendario, prorrogables por igual término"],
e:"Art. 15: reclamos en 15 días hábiles, prorrogables hasta 8 días hábiles. Las consultas: 10 días hábiles, prorrogables hasta 5 (art. 14).",f:"Ley 1581/2012, arts. 14-15"},
{tm:"T10",t:3,af:"El responsable del tratamiento debe conservar prueba de la autorización otorgada por el titular.",
rz:"La autorización debe obtenerse por cualquier medio que pueda ser objeto de consulta posterior.",a:0,
e:"La exigencia de que la autorización pueda consultarse después explica el deber de conservar su prueba (Ley 1581, arts. 9 y 17; Dec. 1074/2015).",f:"Ley 1581/2012, arts. 9 y 17"},
{tm:"T10",t:1,q:"La ley que regula específicamente el hábeas data financiero, crediticio y comercial es:",
o:["La Ley 1266 de 2008","La Ley 1581 de 2012","La Ley 1712 de 2014","La Ley 1273 de 2009"],
e:"La Ley 1266 de 2008 regula la información financiera, crediticia y comercial. La Ley 1273 tipifica delitos informáticos.",f:"Ley 1266/2008"},
{tm:"T10",t:1,q:"Para acudir en queja ante la SIC por vulneración del régimen de datos personales, el titular debe:",
o:["Agotar previamente el trámite de consulta o reclamo ante el responsable o encargado","Presentar primero una acción de tutela","Obtener concepto previo de la Personería","Acreditar daño patrimonial cuantificado"],
e:"Art. 16: requisito de procedibilidad.",f:"Ley 1581/2012, art. 16"},
{tm:"T10",t:3,af:"Un servidor puede publicar en redes sociales institucionales la lista de quejosos con sus datos de contacto para demostrar transparencia.",
rz:"La información pública cuya divulgación cause daño a la intimidad de personas naturales puede ser exceptuada como información clasificada.",a:3,
e:"Publicar datos de contacto de quejosos sin autorización viola la Ley 1581. La razón es verdadera (Ley 1712, art. 18).",f:"Ley 1581/2012; Ley 1712/2014, art. 18"},

/* ───────── T11 · Transparencia y acceso a la información pública ───────── */
{tm:"T11",t:1,q:"El principio de máxima publicidad para titular universal (Ley 1712) significa que:",
o:["Toda información en posesión, bajo control o custodia de un sujeto obligado es pública y no puede reservarse o limitarse sino por disposición constitucional o legal","Toda información pública debe publicarse en redes sociales de la entidad","La información solo es pública cuando el solicitante demuestra un interés legítimo","El sujeto obligado decide discrecionalmente qué información divulgar"],
e:"Art. 2 Ley 1712: máxima publicidad, con excepciones solo de rango constitucional o legal.",f:"Ley 1712/2014, art. 2"},
{tm:"T11",t:1,q:"La información cuyo acceso puede rechazarse por causar daño al derecho a la intimidad de una persona natural se denomina:",
o:["Información pública clasificada","Información pública reservada","Información pública de divulgación proactiva","Información semiprivada financiera"],
e:"Art. 18: clasificada (daño a derechos de personas naturales o jurídicas). Art. 19: reservada (daño a intereses públicos como defensa o seguridad nacional).",f:"Ley 1712/2014, arts. 18-19"},
{tm:"T11",t:1,q:"La reserva de las informaciones amparadas por el artículo 19 de la Ley 1712 no puede extenderse por un período mayor a:",
o:["Quince años","Diez años","Veinte años","Treinta años"],
e:"Art. 22 Ley 1712: máximo 15 años.",f:"Ley 1712/2014, art. 22"},
{tm:"T11",t:2,q:"Sobre el régimen de la Ley 1712 de 2014:",
s:["El Ministerio Público, en cabeza de la Procuraduría, es el órgano garante del derecho de acceso.","Toda solicitud de acceso debe motivarse indicando el interés del solicitante.","Los organismos de control son sujetos obligados.","La reserva de información puede mantenerse de forma indefinida."],a:1,
e:"Verdaderas 1 y 3. No se exige motivar la solicitud y la reserva tiene límite de 15 años.",f:"Ley 1712/2014, arts. 5, 22 y 23"},
{tm:"T11",t:3,af:"Los sujetos obligados deben publicar el directorio de sus servidores y contratistas, con la escala salarial correspondiente.",
rz:"La Ley 1712 regula la transparencia activa: la publicación de información mínima obligatoria sin necesidad de solicitud.",a:0,
e:"El art. 9 lit. c) exige publicar el directorio. Es un ejemplo de transparencia activa, que la razón explica.",f:"Ley 1712/2014, art. 9"},
{tm:"T11",t:1,q:"¿Qué instrumento de gestión de información identifica la información clasificada o reservada de la entidad?",
o:["El Índice de Información Clasificada y Reservada","El Registro de Activos de Información","El Esquema de Publicación de Información","El Programa de Gestión Documental"],
e:"La Ley 1712 prevé tres instrumentos: Registro de Activos de Información, Índice de Información Clasificada y Reservada y Esquema de Publicación (arts. 13, 20 y 12).",f:"Ley 1712/2014, arts. 12, 13 y 20"},
{tm:"T11",t:1,q:"Cuando un sujeto obligado niega información invocando una excepción, la carga de la prueba corresponde a:",
o:["El sujeto obligado","El solicitante","El juez administrativo","La Procuraduría General de la Nación"],
e:"Art. 28 Ley 1712: la carga de la prueba está en cabeza del sujeto obligado.",f:"Ley 1712/2014, art. 28"},
{tm:"T11",t:3,af:"Una solicitud de acceso a información pública puede presentarse de forma verbal.",
rz:"La Ley 1712 exige que toda solicitud se presente por escrito con firma del solicitante.",a:2,
e:"La solicitud puede ser verbal, escrita o por medio electrónico (art. 25). La razón es falsa.",f:"Ley 1712/2014, art. 25"},
{tm:"T11",t:1,q:"El deber de publicar y divulgar documentos de forma rutinaria y proactiva, más allá de lo solicitado, corresponde al principio de:",
o:["Divulgación proactiva de la información","Calidad de la información","Gratuidad","Facilitación"],
