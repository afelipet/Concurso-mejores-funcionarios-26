e:"Art. 3 Ley 1712: el principio de divulgación proactiva implica publicar sin esperar solicitudes.",f:"Ley 1712/2014, art. 3"},

/* ───────── T12 · Prevención de la corrupción y control de la gestión pública ───────── */
{tm:"T12",t:1,q:"La Ley 2195 de 2022 ordenó a las entidades públicas adoptar un instrumento que reemplaza el Plan Anticorrupción y de Atención al Ciudadano. ¿Cuál?",
o:["El Programa de Transparencia y Ética Pública","El Plan Institucional de Capacitación","El Mapa de Aseguramiento","El Plan Anual de Adquisiciones"],
e:"Art. 31 de la Ley 2195. En la Personería, la Dirección de Planeación dirige su consolidación (Acuerdo 978, art. 40 num. 10).",f:"Ley 2195/2022, art. 31; Acuerdo 978/2025, art. 40"},
{tm:"T12",t:1,q:"Según el Código General Disciplinario (Ley 1952 de 2019), la sanción para las faltas gravísimas dolosas es:",
o:["Destitución e inhabilidad general de diez a veinte años","Destitución e inhabilidad general de cinco a diez años","Suspensión en el ejercicio del cargo de tres a dieciocho meses","Multa de diez a ciento ochenta días de salario"],
e:"Art. 48 Ley 1952: gravísimas dolosas, destitución e inhabilidad de 10 a 20 años; gravísimas con culpa gravísima, 5 a 10 años.",f:"Ley 1952/2019, art. 48"},
{tm:"T12",t:2,q:"Sobre la reforma disciplinaria de la Ley 2094 de 2021 y su efecto institucional:",
s:["La misma autoridad debe instruir y juzgar cada proceso disciplinario.","La reforma suprimió la doble instancia en materia disciplinaria.","Las personerías perdieron toda competencia disciplinaria.","El Acuerdo 978 de 2025 renombró las delegadas de Potestad Disciplinaria como de Instrucción y de Juzgamiento, en armonía con la separación de esas etapas."],a:3,
e:"La Ley 2094 exige separar instrucción y juzgamiento y garantiza la doble conformidad. Las personerías conservan competencia. Solo la 4 es verdadera.",f:"Ley 2094/2021; Acuerdo 978/2025, art. 8"},
{tm:"T12",t:1,q:"El servidor público que, abusando de su cargo, constriñe o induce a alguien a dar o prometer dinero o utilidad indebidos comete:",
o:["Concusión","Cohecho propio","Peculado por apropiación","Tráfico de influencias de servidor público"],
e:"Art. 404 Código Penal: concusión. En el cohecho propio el servidor recibe para retardar u omitir un acto propio del cargo.",f:"Ley 599/2000, arts. 404-405"},
{tm:"T12",t:1,q:"¿Ante quién pueden inscribirse las veedurías ciudadanas?",
o:["Ante las personerías municipales o distritales, o ante las cámaras de comercio","Exclusivamente ante la Registraduría Nacional","Ante la Contraloría competente, que expide su personería jurídica","Ante la Procuraduría Regional del lugar"],
e:"Art. 3 Ley 850 de 2003.",f:"Ley 850/2003, art. 3"},
{tm:"T12",t:3,af:"La Personería de Bogotá decide sobre la competencia preferente en procesos que adelantan las oficinas de control interno disciplinario del Distrito.",
rz:"La Procuraduría General de la Nación puede ejercer poder disciplinario preferente incluso frente a la Personería.",a:1,
e:"Ambas son verdaderas (Acuerdo 978, art. 42 num. 4; CP art. 277), pero el poder preferente de la PGN no explica la competencia de la Personería frente a las oficinas distritales.",f:"Acuerdo 978/2025, art. 42; CP art. 277"},
{tm:"T12",t:1,q:"La Ley 2013 de 2019 obliga a ciertos servidores a publicar:",
o:["La declaración de bienes y rentas, el registro de conflictos de interés y la declaración del impuesto sobre la renta","Su historia clínica ocupacional y sus evaluaciones de desempeño","Los antecedentes disciplinarios de su núcleo familiar","El listado de contratistas que supervisan y sus honorarios personales"],
e:"La Ley 2013 de 2019 exige publicar esas tres declaraciones en el aplicativo de la Función Pública.",f:"Ley 2013/2019"},
{tm:"T12",t:1,q:"La Ley 1474 de 2011 dispone que en toda entidad pública deberá existir por lo menos una dependencia encargada de:",
o:["Recibir, tramitar y resolver las quejas, sugerencias y reclamos de los ciudadanos","Ejercer el control fiscal previo de los contratos","Adelantar las investigaciones penales por corrupción","Certificar la idoneidad ética de los contratistas"],
e:"Art. 76 de la Ley 1474.",f:"Ley 1474/2011, art. 76"},
{tm:"T12",t:2,q:"Sobre impedimentos y conflictos de interés (CPACA, art. 11):",
s:["Cuando el interés general propio de la función entre en conflicto con un interés particular del servidor, este debe declararse impedido.","El servidor puede decidir el asunto si manifiesta verbalmente su conflicto a un compañero.","Si el servidor no manifiesta su impedimento, el interesado puede recusarlo.","Tener interés particular en la actuación no es causal de impedimento si el servidor es de carrera."],a:1,
e:"Verdaderas 1 y 3 (arts. 11 y 12 CPACA). El impedimento se tramita formalmente ante el superior y la causal aplica a todo servidor.",f:"Ley 1437/2011, arts. 11-12"},

/* ───────── T13 · Código de Integridad y valores del servicio público ───────── */
{tm:"T13",t:1,q:"¿Cuál de los siguientes NO es uno de los cinco valores del Código de Integridad del Servicio Público?",
o:["Lealtad institucional","Honestidad","Diligencia","Justicia"],
e:"Los cinco valores son honestidad, respeto, compromiso, diligencia y justicia.",f:"Código de Integridad del Servicio Público (DAFP)"},
{tm:"T13",t:1,q:"Según el PEI 2024-2028, el Código de Integridad de la Personería de Bogotá declara siete valores. Además de los cinco del Código de Integridad del Servicio Público, incluye:",
o:["Crecimiento personal y liderazgo","Lealtad y obediencia","Eficiencia y productividad","Solidaridad y tolerancia"],
e:"El PEI enumera honestidad, respeto, compromiso, diligencia, justicia, crecimiento personal y liderazgo como valores del Código de Integridad de la Personería.",f:"PEI 01-PL-012 v4, num. 6.5 (Valores)"},
{tm:"T13",t:1,q:"El Distrito Capital acogió el Código de Integridad del Servicio Público mediante:",
o:["El Decreto Distrital 118 de 2018","El Acuerdo Distrital 978 de 2025","La Ley 1474 de 2011","El Decreto Ley 1421 de 1993"],
e:"El Decreto 118 de 2018 adoptó el Código de Integridad en el Distrito, armonizándolo con el Ideario Ético.",f:"Dec. Distrital 118/2018"},
{tm:"T13",t:1,q:"«Cumplo con los deberes, funciones y responsabilidades asignadas a mi cargo de la mejor manera posible, con atención, prontitud, destreza y eficiencia, para optimizar el uso de los recursos del Estado». Este enunciado define el valor:",
o:["Diligencia","Compromiso","Honestidad","Respeto"],
e:"Esa es la definición de diligencia en el Código de Integridad.",f:"Código de Integridad"},
{tm:"T13",t:1,q:"«Actúo con imparcialidad garantizando los derechos de las personas, con equidad, igualdad y sin discriminación». Este enunciado corresponde al valor:",
o:["Justicia","Respeto","Diligencia","Compromiso"],
e:"Definición de justicia. Respeto es reconocer y valorar a las personas con sus virtudes y defectos.",f:"Código de Integridad"},
{tm:"T13",t:2,q:"Sobre los principios de acción del Código de Integridad:",
s:["Postergar decisiones cuando no se tiene toda la información es una conducta propia de la diligencia.","Dar trato preferencial a personas cercanas es contrario a la honestidad.","Atender sin escuchar cuando se está ocupado es coherente con el respeto.","Estar dispuesto a ponerse en los zapatos de las personas es propio del compromiso."],a:2,
e:"Verdaderas 2 y 4. La diligencia rechaza postergar sin justificación y el respeto exige atención y escucha.",f:"Código de Integridad – principios de acción"},
{tm:"T13",t:3,af:"Los gestores de integridad sustituyen al jefe de la entidad en la responsabilidad de implementar el Código de Integridad.",
rz:"Los gestores de integridad promueven la apropiación de los valores del servicio público en la entidad.",a:3,
e:"La responsabilidad es de la alta dirección; los gestores apoyan y promueven la apropiación.",f:"Política de Integridad"},
{tm:"T13",t:1,q:"Antes del Código de Integridad, el Distrito Capital orientaba la ética pública con:",
o:["El Ideario Ético del Distrito Capital (Acuerdo 244 de 2006)","El Código Disciplinario Único (Ley 734 de 2002)","El Estatuto Anticorrupción (Ley 1474 de 2011)","El Código de Buen Gobierno de la Alcaldía Mayor"],
e:"El Acuerdo 244 de 2006 estableció principios y valores éticos para la función pública distrital; luego se armonizó con el Código de Integridad.",f:"Acuerdo Distrital 244/2006; Dec. 118/2018"},
{tm:"T13",t:1,q:"Un compañero le ofrece agilizar el turno de un usuario conocido a cambio de un obsequio. ¿Qué valor se vulnera principalmente?",
o:["Honestidad","Diligencia","Compromiso","Respeto"],
e:"La honestidad prohíbe aceptar beneficios por las funciones y dar trato preferencial.",f:"Código de Integridad"},

/* ───────── T14 · Gestión documental, archivos y conservación ───────── */
{tm:"T14",t:1,q:"El ciclo vital del documento comprende las etapas de:",
o:["Archivo de gestión, archivo central y archivo histórico","Producción, recepción y destrucción","Archivo físico, archivo digital y nube","Radicación, distribución y respuesta"],
e:"Ley 594 de 2000, art. 23.",f:"Ley 594/2000, art. 23"},
{tm:"T14",t:1,q:"La Tabla de Retención Documental (TRD) es:",
o:["El listado de series con sus subseries y tipos documentales, a los cuales se asigna el tiempo de permanencia en cada etapa del ciclo vital","El inventario de documentos que se transfieren al archivo central","El plan de digitalización de documentos históricos","El registro de comunicaciones oficiales recibidas"],
e:"Definición del glosario archivístico del AGN.",f:"Ley 594/2000; Acuerdo AGN 027/2006"},
{tm:"T14",t:1,q:"El principio según el cual los documentos de una entidad no deben mezclarse con los de otras se denomina:",
o:["Principio de procedencia","Principio de orden original","Principio de disponibilidad","Principio de conservación"],
e:"Procedencia: respetar el origen productor. Orden original: respetar el orden en que se produjeron los documentos.",f:"Glosario AGN"},
{tm:"T14",t:2,q:"Sobre los instrumentos archivísticos del Decreto 1080 de 2015:",
s:["El Cuadro de Clasificación Documental es un instrumento archivístico.","La Tabla de Retención Documental es un instrumento archivístico.","El Programa de Gestión Documental es un instrumento archivístico.","La matriz de riesgos de corrupción es un instrumento archivístico."],a:0,
e:"Verdaderas 1, 2 y 3. Otros: PINAR, inventario documental, modelo de requisitos para documentos electrónicos, bancos terminológicos, tablas de control de acceso.",f:"Dec. 1080/2015, art. 2.8.2.5.8"},
{tm:"T14",t:3,af:"Los documentos con valor histórico se conservan de manera permanente.",
rz:"La Ley 594 de 2000 los considera parte del patrimonio documental de la Nación.",a:0,
e:"La condición de patrimonio documental explica su conservación permanente.",f:"Ley 594/2000"},
{tm:"T14",t:1,q:"¿Cuál NO es una forma de disposición final prevista en las TRD?",
o:["Reciclaje inmediato a criterio del servidor","Conservación total","Selección","Eliminación"],
e:"Las opciones de disposición final son conservación total, selección, eliminación y medios técnicos (microfilmación o digitalización).",f:"Acuerdo AGN 004/2019"},
{tm:"T14",t:1,q:"El formato que se diligencia para inventariar y transferir documentos entre archivos es:",
o:["El Formato Único de Inventario Documental (FUID)","El Registro de Activos de Información","La hoja de control de radicación","El formato de préstamo documental"],
e:"El FUID es el formato estandarizado para inventarios documentales y transferencias.",f:"Acuerdo AGN 042/2002"},
{tm:"T14",t:3,af:"Un servidor puede eliminar documentos de su dependencia cuando considere que ya no son útiles.",
rz:"La eliminación de documentos solo procede conforme a las tablas de retención o valoración aprobadas y mediante el procedimiento con acta.",a:3,
e:"La afirmación es falsa: eliminar sin TRD/TVD aprobadas puede constituir falta disciplinaria. La razón es verdadera.",f:"Ley 594/2000; Acuerdo AGN 004/2019"},
{tm:"T14",t:1,q:"El ente rector de la política archivística en el Distrito Capital es:",
o:["La Secretaría General de la Alcaldía Mayor, a través de la Dirección Distrital de Archivo de Bogotá","La Personería de Bogotá, a través de su Secretaría General","El Archivo General de la Nación, sin participación distrital","La Contraloría de Bogotá"],
e:"La Secretaría General, mediante la Dirección Distrital de Archivo de Bogotá, lidera el Sistema Distrital de Archivos.",f:"Sistema Distrital de Archivos"}
];

/* Banco de preguntas — Parte 3: derechos humanos, enfoques, mujeres, acoso, NNA y sujetos de especial protección */
const Q3 = [
/* ───────── T15 · Derechos humanos y atención a víctimas del conflicto armado ───────── */
{tm:"T15",t:1,q:"Para la Ley 1448 de 2011, son víctimas quienes hayan sufrido un daño por hechos ocurridos:",
o:["A partir del 1 de enero de 1985, por infracciones al DIH o violaciones graves de normas internacionales de DD.HH., ocurridas con ocasión del conflicto armado interno","A partir del 1 de enero de 1991, por cualquier delito cometido en el territorio nacional","A partir de la Constitución de 1991, solo por hechos de grupos guerrilleros","Desde 1948, por cualquier hecho de violencia política"],
e:"Art. 3 Ley 1448. Quienes sufrieron hechos antes de 1985 tienen derecho a verdad, medidas simbólicas y garantías de no repetición, pero no a reparación económica.",f:"Ley 1448/2011, art. 3"},
{tm:"T15",t:1,q:"La restitución de tierras de la Ley 1448 aplica a despojos o abandonos ocurridos:",
o:["Entre el 1 de enero de 1991 y el término de vigencia de la ley","Entre el 1 de enero de 1985 y 2011","Desde 1948, por cualquier causa","Solo a partir de la expedición de la ley"],
e:"Art. 75: la fecha de corte para restitución es el 1 de enero de 1991.",f:"Ley 1448/2011, art. 75"},
{tm:"T15",t:1,q:"Para hechos victimizantes posteriores a la vigencia de la Ley 1448, el término para rendir la declaración ante el Ministerio Público es:",
o:["Dos años contados a partir de la ocurrencia del hecho","Cuatro años contados desde la vigencia de la ley","Seis meses contados desde el hecho","Un año contado desde la denuncia penal"],
e:"Art. 155: cuatro años para hechos anteriores y dos años desde la ocurrencia para los posteriores. Vencido el término, el Ministerio Público indaga barreras de acceso (Acuerdo 978, art. 36 num. 3).",f:"Ley 1448/2011, art. 155"},
{tm:"T15",t:2,q:"Sobre las medidas de reparación integral de la Ley 1448:",
s:["La restitución es una medida de reparación.","La condonación de deudas tributarias nacionales es una medida autónoma de reparación.","La satisfacción es una medida de reparación.","La reparación integral excluye las garantías de no repetición."],a:1,
e:"La reparación comprende restitución, indemnización, rehabilitación, satisfacción y garantías de no repetición (art. 69). Verdaderas 1 y 3.",f:"Ley 1448/2011, arts. 25 y 69"},
{tm:"T15",t:1,q:"El Registro Único de Víctimas (RUV) es administrado por:",
o:["La Unidad para la Atención y Reparación Integral a las Víctimas","La Personería de Bogotá","La Defensoría del Pueblo","La Registraduría Nacional del Estado Civil"],
e:"Art. 154: lo administra la Unidad para las Víctimas. El Ministerio Público recibe las declaraciones y las remite.",f:"Ley 1448/2011, art. 154"},
{tm:"T15",t:3,af:"Los miembros de grupos armados organizados al margen de la ley no son considerados víctimas, salvo los niños, niñas y adolescentes desvinculados siendo menores de edad.",
rz:"La Ley 1448 de 2011 consagra expresamente esa exclusión y esa excepción.",a:0,
e:"Art. 3 parágrafo 2 de la Ley 1448. La razón explica la afirmación.",f:"Ley 1448/2011, art. 3 par. 2"},
{tm:"T15",t:1,q:"En virtud del principio de buena fe de la Ley 1448, la víctima puede acreditar el daño:",
o:["Por cualquier medio legalmente aceptado; basta la prueba sumaria para que la autoridad la releve de la carga de la prueba","Únicamente con sentencia penal condenatoria contra el victimario","Mediante certificación de la Fiscalía de que existe denuncia","Con declaración extrajuicio ante notario y dos testigos"],
e:"Art. 5: el Estado presume la buena fe; basta prueba sumaria.",f:"Ley 1448/2011, art. 5"},
{tm:"T15",t:1,q:"En Bogotá, la secretaría técnica de la Mesa Distrital de Participación Efectiva de Víctimas la ejerce:",
o:["La Personería de Bogotá, a través de la Delegada para la Protección de las Víctimas","La Alta Consejería para la Paz, las Víctimas y la Reconciliación","La Unidad para las Víctimas, dirección territorial","El Concejo de Bogotá"],
e:"Art. 193 de la Ley 1448 asigna a las personerías la secretaría técnica de las mesas municipales y distritales; el Acuerdo 978, art. 36 num. 7, la asigna a la Delegada para las Víctimas.",f:"Ley 1448/2011, art. 193; Acuerdo 978/2025, art. 36"},
{tm:"T15",t:1,q:"El principio del DIH que obliga a diferenciar en todo momento entre combatientes y población civil es el de:",
o:["Distinción","Proporcionalidad","Necesidad militar","Humanidad"],
e:"Distinción. La proporcionalidad prohíbe ataques cuyo daño civil incidental sea excesivo frente a la ventaja militar.",f:"Protocolo I Adicional, art. 48"},
{tm:"T15",t:3,af:"Las personerías reciben declaraciones de víctimas para su valoración e inclusión en el RUV.",
rz:"La Unidad para las Víctimas delegó en las personerías la decisión de inclusión en el registro.",a:2,
e:"El Ministerio Público recibe la declaración y la remite (art. 155), pero la decisión de inclusión es de la Unidad para las Víctimas (art. 156). La razón es falsa.",f:"Ley 1448/2011, arts. 155-156"},

/* ───────── T16 · Enfoque diferencial, de género e interseccional ───────── */
{tm:"T16",t:1,q:"El enfoque diferencial, según la Ley 1448 de 2011, reconoce que:",
o:["Hay poblaciones con características particulares en razón de su edad, género, orientación sexual o situación de discapacidad, que requieren medidas específicas","Todas las personas deben recibir exactamente el mismo trato sin ninguna distinción","Solo las comunidades étnicas tienen derecho a medidas especiales","Las medidas especiales se aplican únicamente por orden judicial"],
e:"Art. 13 Ley 1448. El enfoque diferencial busca la igualdad material mediante medidas específicas.",f:"Ley 1448/2011, art. 13"},
{tm:"T16",t:1,q:"El enfoque interseccional permite:",
o:["Analizar cómo confluyen varias categorías de discriminación (género, etnia, edad, discapacidad, clase) y generan experiencias específicas de desigualdad","Sumar aritméticamente las discriminaciones como si fueran independientes","Priorizar siempre la categoría de género sobre las demás","Atender exclusivamente a mujeres víctimas de violencia sexual"],
e:"La interseccionalidad examina la interacción de factores, no su suma separada.",f:"Doctrina sobre enfoque interseccional"},
{tm:"T16",t:1,q:"El fundamento constitucional de las acciones afirmativas en favor de grupos discriminados o marginados se encuentra en:",
o:["El artículo 13, que ordena promover condiciones para que la igualdad sea real y efectiva","El artículo 209, que regula la función administrativa","El artículo 125, que regula la carrera administrativa","El artículo 86, que regula la acción de tutela"],
e:"El art. 13 inciso 2 ordena adoptar medidas en favor de grupos discriminados o marginados.",f:"CP art. 13"},
{tm:"T16",t:2,q:"Sobre igualdad y no discriminación:",
s:["Las acciones afirmativas son contrarias al artículo 13 de la Constitución.","La Ley 581 de 2000 regula la participación de las mujeres en los niveles decisorios del poder público.","La interseccionalidad consiste en sumar discriminaciones independientes.","La Ley 1482 de 2011 sanciona penalmente actos de discriminación y hostigamiento."],a:2,
e:"Verdaderas 2 y 4. Las acciones afirmativas desarrollan el art. 13 y la interseccionalidad analiza la interacción de categorías.",f:"Ley 581/2000; Ley 1482/2011"},
{tm:"T16",t:3,af:"Las acciones afirmativas son compatibles con el principio de igualdad.",
rz:"El artículo 13 de la Constitución ordena al Estado adoptar medidas en favor de grupos discriminados o marginados.",a:0,
e:"El propio art. 13 legitima las acciones afirmativas como medio de igualdad material.",f:"CP art. 13"},
{tm:"T16",t:1,q:"Según el Acuerdo 978 de 2025, la Delegada para la Defensa y Protección de DD.HH. II verifica las acciones con enfoque diferencial respecto de varias poblaciones. ¿Cuál NO está mencionada?",
o:["Personas pensionadas del sector público","Pueblo Rrom gitano","Habitantes de calle","Personas migrantes"],
e:"Art. 34 num. 2: población LGBTI, sector interreligioso, pueblos indígenas, comunidades NARP, pueblo Rrom, habitantes de calle, migrantes, trabajadores sexuales y demás población vulnerable.",f:"Acuerdo 978/2025, art. 34"},
{tm:"T16",t:1,q:"El enfoque de género en la gestión pública consiste en:",
o:["Analizar las relaciones de poder y las desigualdades construidas socialmente entre los géneros para orientar acciones que las corrijan","Atender exclusivamente a las mujeres","Asignar cuotas de contratación por sexo en todos los empleos","Usar el lenguaje masculino genérico en todos los documentos"],
e:"El enfoque de género es una herramienta de análisis de desigualdades de poder.",f:"Política Pública de Mujeres y Equidad de Género"},
{tm:"T16",t:1,q:"Una persona trans pide en la ventanilla de atención ser llamada por su nombre identitario, distinto al de su documento. El servidor debe:",
o:["Respetar su identidad de género y usar el nombre con el que se identifica, registrando el dato del documento solo donde sea legalmente necesario","Usar el nombre del documento porque es el único jurídicamente válido","Exigirle que primero corrija su registro civil","Remitirla a otra dependencia especializada"],
e:"La jurisprudencia constitucional protege la identidad de género y el trato digno; el uso del nombre identitario no impide registrar el dato legal donde se requiera.",f:"Corte Constitucional, línea sobre identidad de género (p. ej., T-063/2015)"},

/* ───────── T17 · Prevención, atención y sanción de violencias y discriminación contra las mujeres ───────── */
{tm:"T17",t:1,q:"La Ley 1257 de 2008 define la violencia contra la mujer como:",
o:["Cualquier acción u omisión que le cause muerte, daño o sufrimiento físico, sexual, psicológico, económico o patrimonial por su condición de mujer, así como amenazas, coacción o privación arbitraria de la libertad, en el ámbito público o privado","Únicamente las agresiones físicas cometidas por la pareja en el hogar","Las conductas tipificadas como delito que dejen secuelas médicas","Las agresiones cometidas en el ámbito laboral"],
e:"Art. 2 Ley 1257: definición amplia que comprende varios tipos de daño, en el ámbito público y privado.",f:"Ley 1257/2008, art. 2"},
{tm:"T17",t:1,q:"¿Cuál NO es un tipo de daño contra la mujer definido en la Ley 1257 de 2008?",
o:["Daño reputacional corporativo","Daño psicológico","Daño sexual","Daño patrimonial"],
e:"Art. 3: daño psicológico, físico, sexual y patrimonial.",f:"Ley 1257/2008, art. 3"},
{tm:"T17",t:1,q:"El feminicidio fue tipificado como delito autónomo por:",
o:["La Ley 1761 de 2015 (Ley Rosa Elvira Cely)","La Ley 1257 de 2008","La Ley 1719 de 2014","La Ley 2365 de 2024"],
e:"La Ley 1761 creó el art. 104A del Código Penal. La 1719 trata de violencia sexual en el conflicto armado.",f:"Ley 1761/2015"},
{tm:"T17",t:2,q:"Sobre las medidas de protección para mujeres víctimas de violencia:",
s:["Puede ordenarse al agresor el desalojo de la casa de habitación.","Puede prohibirse al agresor acercarse a la víctima.","Puede ordenarse al agresor un tratamiento reeducativo y terapéutico.","Puede exigirse a la víctima conciliar con el agresor como requisito para recibir protección."],a:0,
e:"Verdaderas 1, 2 y 3 (art. 17 Ley 1257). La víctima tiene derecho a no ser confrontada con el agresor y no puede condicionarse su protección a una conciliación.",f:"Ley 1257/2008, arts. 8 y 17"},
{tm:"T17",t:3,af:"La mujer víctima de violencia tiene derecho a no ser confrontada con su agresor.",
rz:"La conciliación es requisito obligatorio de procedibilidad en los asuntos de violencia contra la mujer.",a:2,
e:"El derecho a no ser confrontada está en el art. 8 de la Ley 1257. La razón es falsa: la ley protege a la víctima frente a mecanismos que impliquen confrontación.",f:"Ley 1257/2008, art. 8"},
{tm:"T17",t:1,q:"La autoridad administrativa competente para adoptar medidas de protección en casos de violencia en el contexto familiar es:",
o:["La Comisaría de Familia","La Personería Local","La Inspección de Tránsito","La Oficina de Control Interno Disciplinario"],
e:"Ley 294 de 1996 y Ley 2126 de 2021. La Personería vigila el cumplimiento de las rutas.",f:"Ley 294/1996; Ley 2126/2021"},
{tm:"T17",t:1,q:"La línea distrital de Bogotá que brinda atención psicosocial a mujeres víctimas de violencias es:",
o:["Línea Púrpura Distrital «Mujeres que escuchan mujeres»","Línea 141 del ICBF","Línea 195 de servicios de la Alcaldía","Línea 106 de escucha a niños, niñas y adolescentes"],
e:"La Línea Púrpura Distrital, de la Secretaría de la Mujer, atiende a mujeres. La 141 es del ICBF para NNA.",f:"Secretaría Distrital de la Mujer"},
{tm:"T17",t:1,q:"El instrumento interamericano específico sobre violencia contra la mujer es:",
o:["La Convención de Belém do Pará","La CEDAW","El Pacto de San José","La Convención de Palermo"],
e:"La Convención Interamericana para Prevenir, Sancionar y Erradicar la Violencia contra la Mujer (Belém do Pará, 1994). La CEDAW es del sistema universal.",f:"Ley 248/1995"},
{tm:"T17",t:1,q:"Según la Ley 1257 de 2008, ¿qué conducta encaja en la noción de violencia económica?",
o:["El control abusivo de las finanzas de la mujer o las recompensas y castigos monetarios por su condición de mujer","Un despido masivo por reestructuración de planta","Una deuda comercial pactada libremente","El cobro de impuestos de un predio"],
e:"Art. 2: violencia económica incluye el abuso económico, el control abusivo de las finanzas y recompensas o castigos monetarios.",f:"Ley 1257/2008, art. 2"},

/* ───────── T18 · Prevención, protección y atención del acoso sexual en el ámbito laboral ───────── */
{tm:"T18",t:1,q:"La Ley 2365 de 2024 define el acoso sexual como:",
o:["Todo acto de persecución, hostigamiento o asedio de carácter o connotación sexual, lasciva o libidinosa, que se manifieste por relaciones de poder de orden vertical u horizontal","Únicamente el acceso carnal violento cometido en el lugar de trabajo","Cualquier conflicto interpersonal entre compañeros de trabajo","La conducta de un superior que asigna cargas excesivas de trabajo"],
e:"Art. 2 Ley 2365. El acoso puede ser vertical u horizontal y no requiere jerarquía.",f:"Ley 2365/2024, art. 2"},
{tm:"T18",t:1,q:"Según la Ley 2365 de 2024, se presume que el acoso sexual ocurrió en el contexto laboral cuando se comete:",
o:["En los trayectos entre el domicilio y el lugar de trabajo, por una persona que hace parte del contexto laboral","Únicamente dentro de la sede física de la entidad, en horario laboral","Solo cuando agresor y víctima tienen el mismo empleador","Solo cuando existe una relación jerárquica directa"],
e:"Art. 3: la ley incluye los trayectos y el alojamiento suministrado por el empleador, entre otros lugares.",f:"Ley 2365/2024, art. 3"},
{tm:"T18",t:3,af:"Para que la entidad avoque competencia frente a un caso de acoso sexual no se exige acreditar una relación laboral o contractual entre la víctima y quien cometió el acoso.",
rz:"La Ley 2365 de 2024 dispone expresamente que en ningún caso se debe acreditar esa relación como requisito.",a:0,
e:"Art. 3 Ley 2365. La razón explica la afirmación.",f:"Ley 2365/2024, art. 3"},
{tm:"T18",t:1,q:"El acoso sexual como delito está tipificado en:",
o:["El artículo 210A del Código Penal","La Ley 1010 de 2006","La Ley 2365 de 2024, como contravención","El Código Nacional de Seguridad y Convivencia"],
e:"El art. 210A del Código Penal tipifica el acoso sexual. La Ley 2365 regula medidas de prevención, protección y atención; la Ley 1010, el acoso laboral.",f:"Ley 599/2000, art. 210A"},
{tm:"T18",t:2,q:"Sobre el acoso laboral (Ley 1010 de 2006):",
s:["Sus modalidades incluyen maltrato, persecución, discriminación, entorpecimiento, inequidad y desprotección laboral.","El Comité de Convivencia Laboral impone sanciones disciplinarias al acosador.","Excepcionalmente, un solo acto hostil puede bastar para acreditar el acoso laboral.","La Ley 1010 es la única norma aplicable a los casos de acoso sexual."],a:1,
e:"Verdaderas 1 y 3 (arts. 2 y 7). El comité promueve conciliación y medidas preventivas, no sanciona. El acoso sexual tiene regulación propia (Ley 2365, art. 210A CP).",f:"Ley 1010/2006, arts. 2 y 7"},
{tm:"T18",t:1,q:"Según la Ley 2365 de 2024, las personas investigadas por presunto acoso sexual tienen derecho a:",
o:["El debido proceso, la presunción de inocencia y la defensa","Ser sancionadas de inmediato sin investigación","Que la víctima sea confrontada con ellas en audiencia obligatoria","Que se archive la investigación si la víctima no aporta testigos"],
e:"Art. 2 Ley 2365: las víctimas tienen derechos y las personas investigadas conservan sus garantías.",f:"Ley 2365/2024, art. 2"},
{tm:"T18",t:1,q:"Además del contexto laboral, la Ley 2365 de 2024 regula medidas frente al acoso sexual en:",
o:["Las instituciones de educación superior","Los establecimientos de comercio abiertos al público","Los conjuntos residenciales sometidos a propiedad horizontal","El transporte público urbano"],
e:"El título de la ley incluye expresamente las instituciones de educación superior.",f:"Ley 2365/2024"},
{tm:"T18",t:3,af:"La Ley 2365 de 2024 busca garantizar el derecho a la igualdad, a la no discriminación y a una vida libre de violencias.",
rz:"El acoso sexual solo puede configurarse cuando lo comete un superior jerárquico.",a:2,
e:"El objeto de la ley es cierto (art. 1). La razón es falsa: el acoso puede ser vertical u horizontal (art. 2).",f:"Ley 2365/2024, arts. 1-2"},

/* ───────── T19 · Derechos y protección integral de niños, niñas y adolescentes ───────── */
{tm:"T19",t:1,q:"El artículo 44 de la Constitución establece que los derechos de los niños:",
o:["Prevalecen sobre los derechos de los demás","Se equiparan a los de los adultos sin ninguna prevalencia","Solo son exigibles a través del ICBF","Se limitan a salud y educación"],
e:"Art. 44 CP, inciso final.",f:"CP art. 44"},
{tm:"T19",t:1,q:"Según el Código de la Infancia y la Adolescencia, se entiende por adolescente a la persona:",
o:["Entre los 12 y los 18 años","Entre los 14 y los 18 años","Entre los 10 y los 17 años","Menor de 21 años"],
e:"Art. 3 Ley 1098: niño o niña, de 0 a 12 años; adolescente, de 12 a 18 años.",f:"Ley 1098/2006, art. 3"},
{tm:"T19",t:1,q:"El Sistema de Responsabilidad Penal para Adolescentes aplica a quienes tengan, al momento de cometer el delito:",
o:["Entre 14 y 18 años","Entre 12 y 18 años","Entre 16 y 18 años","Más de 10 años"],
e:"Art. 139 Ley 1098. Los menores de 14 años no son juzgados ni declarados penalmente responsables (art. 142).",f:"Ley 1098/2006, arts. 139 y 142"},
{tm:"T19",t:2,q:"Sobre los principios del Código de la Infancia y la Adolescencia:",
s:["El interés superior del niño obliga a todas las personas a garantizar la satisfacción integral de sus derechos.","La corresponsabilidad vincula a la familia, la sociedad y el Estado.","La protección integral comprende reconocimiento, garantía, prevención de amenazas y restablecimiento de derechos.","La responsabilidad penal de los adolescentes inicia a los 12 años."],a:0,
e:"Verdaderas 1, 2 y 3 (arts. 7, 8 y 10). La responsabilidad penal inicia a los 14 años.",f:"Ley 1098/2006, arts. 7, 8, 10 y 139"},
{tm:"T19",t:3,af:"Una persona menor de 14 años no puede ser juzgada ni declarada responsable penalmente.",
rz:"El Código de la Infancia y la Adolescencia lo dispone expresamente.",a:0,
e:"Art. 142 Ley 1098. En esos casos procede el restablecimiento de derechos.",f:"Ley 1098/2006, art. 142"},
{tm:"T19",t:1,q:"Son autoridades competentes para el restablecimiento de derechos de niños, niñas y adolescentes:",
o:["Los defensores de familia, los comisarios de familia y, subsidiariamente, los inspectores de policía","Los personeros locales y los jueces de paz","Los alcaldes locales y los ediles","Los fiscales delegados ante jueces penales"],
e:"Arts. 96 y 98 Ley 1098. El personero vigila la actuación de esas autoridades.",f:"Ley 1098/2006, arts. 96-98"},
{tm:"T19",t:1,q:"La ley que creó el Sistema Nacional de Convivencia Escolar y la ruta de atención integral para la convivencia es:",
o:["La Ley 1620 de 2013","La Ley 1098 de 2006","La Ley 115 de 1994","La Ley 2089 de 2021"],
e:"La Ley 1620 de 2013 creó el sistema y la ruta. El Acuerdo 978 asigna a la Delegada para el Sector Educación atender situaciones de convivencia escolar.",f:"Ley 1620/2013"},
{tm:"T19",t:1,q:"La ley que prohíbe el castigo físico y los tratos crueles, humillantes o degradantes como método de corrección de niños, niñas y adolescentes es:",
o:["La Ley 2089 de 2021","La Ley 1257 de 2008","La Ley 1620 de 2013","La Ley 1361 de 2009"],
e:"La Ley 2089 de 2021. La 1361 de 2009 es la ley de protección integral a la familia.",f:"Ley 2089/2021"},
{tm:"T19",t:1,q:"Según el Acuerdo 978 de 2025, ¿qué dependencia vigila que se respeten los derechos de los NNA en centros de protección del orden distrital y en los centros del Sistema de Responsabilidad Penal para Adolescentes?",
o:["La Personería Delegada para la Familia y Sujetos de Especial Protección Constitucional","La Personería Delegada para Asuntos Penales I","La Personería Delegada para el Sector Integración Social","La Dirección para la Orientación y Asistencia a las Personas"],
e:"Art. 35 num. 5 del Acuerdo 978.",f:"Acuerdo 978/2025, art. 35"},

/* ───────── T20 · Atención a sujetos de especial protección constitucional ───────── */
{tm:"T20",t:1,q:"La ley que reconoce la capacidad legal plena de las personas con discapacidad mayores de edad y elimina la interdicción es:",
o:["La Ley 1996 de 2019","La Ley 1618 de 2013","La Ley 361 de 1997","La Ley 1306 de 2009"],
e:"La Ley 1996 de 2019 instituye el sistema de apoyos y ajustes razonables. La Ley 1306 de 2009 regulaba la interdicción y fue derogada en esa materia.",f:"Ley 1996/2019"},
{tm:"T20",t:1,q:"Para la Ley 1251 de 2008, se considera persona adulta mayor a quien tiene:",
o:["Sesenta años o más","Sesenta y cinco años o más","Setenta años o más","Cincuenta y siete años o más"],
e:"Art. 3 Ley 1251 de 2008.",f:"Ley 1251/2008, art. 3"},
{tm:"T20",t:1,q:"La ley que fija los lineamientos de la política pública social para habitantes de la calle es:",
o:["La Ley 1641 de 2013","La Ley 1448 de 2011","La Ley 1801 de 2016","La Ley 1098 de 2006"],
e:"La Ley 1641 de 2013 regula la política pública para habitantes de la calle.",f:"Ley 1641/2013"},
{tm:"T20",t:2,q:"Sobre los sujetos de especial protección constitucional:",
s:["Esa condición solo se adquiere mediante declaración judicial previa.","Las personas mayores pierden esa condición al cumplir 80 años.","La flexibilización del requisito de subsidiariedad de la tutela aplica por igual a cualquier persona.","El juez constitucional puede flexibilizar el examen de procedencia de la tutela cuando quien la presenta es sujeto de especial protección."],a:3,
e:"Solo la 4 es verdadera. La condición deriva de la Constitución y la jurisprudencia, y la flexibilización se justifica por esa situación de vulnerabilidad.",f:"Corte Constitucional, jurisprudencia sobre procedencia de tutela"},
{tm:"T20",t:3,af:"Toda persona con discapacidad mayor de edad es sujeto de derecho con capacidad legal plena.",
rz:"La Ley 1996 de 2019 eliminó la interdicción e instituyó los apoyos y los ajustes razonables.",a:0,
e:"Arts. 6 y 53 de la Ley 1996. La razón explica el cambio de modelo.",f:"Ley 1996/2019"},
{tm:"T20",t:1,q:"Según la Convención sobre los Derechos de las Personas con Discapacidad, los ajustes razonables son:",
o:["Modificaciones y adaptaciones necesarias y adecuadas que no impongan una carga desproporcionada o indebida","Los descuentos tributarios a empleadores que contraten personas con discapacidad","Las sanciones por discriminación contra personas con discapacidad","El cupo obligatorio de empleo público para personas con discapacidad"],
e:"Art. 2 de la CDPD (Ley 1346 de 2009).",f:"CDPD art. 2; Ley 1346/2009"},
{tm:"T20",t:1,q:"Es madre o padre cabeza de familia quien:",
o:["Tiene bajo su cargo, económica o socialmente, en forma permanente, hijos menores u otras personas incapaces o en incapacidad para trabajar, ante la ausencia o deficiencia de la pareja","Es el único hijo de una persona adulta mayor","Tiene más de tres hijos, sin importar la presencia de la pareja","Es el titular de la vivienda familiar"],
e:"Ley 82 de 1993 (modificada por la Ley 1232 de 2008).",f:"Ley 82/1993 mod. Ley 1232/2008"},
{tm:"T20",t:1,q:"El Estatuto Temporal de Protección para Migrantes Venezolanos fue adoptado mediante:",
o:["El Decreto 216 de 2021","La Ley 2136 de 2021","El Decreto 1067 de 2015","La Ley 1465 de 2011"],
e:"El Decreto 216 de 2021 adoptó el Estatuto, con el Permiso por Protección Temporal (PPT). La Ley 2136 de 2021 es la política integral migratoria.",f:"Dec. 216/2021"},

o:["El conjunto de funciones, tareas y responsabilidades asignadas a una persona y las competencias requeridas para llevarlas a cabo, para cumplir los planes de desarrollo y los fines del Estado","El contrato de prestación de servicios suscrito con una entidad pública","La vinculación de un particular que ejerce funciones públicas transitorias","El cargo de libre nombramiento y remoción de la alta dirección"],
e:"El empleo es el núcleo básico de la estructura de la función pública (Ley 909, art. 19).",f:"Manual 08-MN-001 v14, Definiciones; Ley 909/2004, art. 19"},
{tm:"T6",t:2,q:"Sobre los requisitos de experiencia en las fichas de la Delegada para Asuntos Policivos y Civiles (todas exigen título de abogado):",
s:["Profesional Especializado 222-04: especialización y 48 meses de experiencia profesional relacionada.","Profesional Especializado 222-02: especialización y 60 meses de experiencia profesional relacionada.","Profesional Universitario 219-01: no requiere experiencia.","Personero Delegado 040-03: especialización y 12 meses de experiencia profesional."],a:1,
e:"222-04: 48 meses relacionada; 222-03: 30 meses relacionada; 222-02: 12 meses de experiencia profesional; 219-01: no requiere; Personero Delegado 040-03: 60 meses relacionada y/o docente. Verdaderas 1 y 3.",f:"Manual 08-MN-001 v14, fichas 2.2.6"},
{tm:"T6",t:1,q:"El Profesional Especializado 222-03 de la Delegada para Asuntos Policivos y Civiles requiere título de abogado, especialización y:",
o:["Treinta meses de experiencia profesional relacionada","Cuarenta y ocho meses de experiencia profesional relacionada","Doce meses de experiencia profesional","Ninguna experiencia"],
e:"Ficha 2.2.6-PRO-222-03-1. Los 48 meses corresponden al grado 04 y los 12 al grado 02.",f:"Manual 08-MN-001 v14, ficha 2.2.6-PRO-222-03-1"},
{tm:"T6",t:1,q:"¿Cuál ficha de la Delegada para Asuntos Policivos y Civiles tiene como propósito dirigir, diseñar e implementar estrategias, lineamientos e instrumentos institucionales para fortalecer el Ministerio Público en materia policiva y civil?",
o:["Profesional Especializado 222-04","Profesional Especializado 222-02","Profesional Universitario 219-01","Auxiliar Administrativo 407-02"],
e:"El 222-04 dirige y diseña estrategias; el 222-03 y el 222-02 ejercen la función de agente del Ministerio Público; el 219-01 la ejecuta.",f:"Manual 08-MN-001 v14, fichas 2.2.6"},
{tm:"T6",t:1,q:"Según las fichas de Profesional Especializado 222-04 y 222-03 de Asuntos Policivos y Civiles, las presuntas irregularidades de los jueces civiles municipales de Bogotá se informan a:",
o:["El Consejo Superior de la Judicatura","La Fiscalía General de la Nación","El Tribunal Superior de Bogotá","La Personería Delegada para la Segunda Instancia"],
e:"Así lo establecen las funciones de esas fichas. La Personería no tiene competencia disciplinaria sobre los jueces.",f:"Manual 08-MN-001 v14, fichas 2.2.6-PRO-222-04-1 y 222-03-1"},
{tm:"T6",t:1,q:"Las fichas profesionales de la Delegada para Asuntos Policivos y Civiles incluyen intervenir como agente del Ministerio Público en:",
o:["Los procesos de cobro coactivo que adelanten las autoridades distritales, en cualquiera de sus etapas","Los procesos de responsabilidad fiscal, como autoridad de decisión","Los juicios de pérdida de investidura de concejales","Las audiencias ante jueces penales con función de control de garantías"],
e:"Es una de sus funciones esenciales. Lo penal corresponde a las Delegadas para Asuntos Penales.",f:"Manual 08-MN-001 v14, fichas 2.2.6"},
{tm:"T6",t:1,q:"En el Manual, el jefe inmediato del Personero Delegado para Asuntos Policivos y Civiles (040-03) es:",
o:["El Personero Auxiliar","El Personero de Bogotá","El Personero Delegado para la Misionalidad del Ministerio Público y la Función Pública","El Secretario General"],
e:"Ficha 2.2.6-DIR-040-03-1.",f:"Manual 08-MN-001 v14, ficha 2.2.6-DIR-040-03-1"},
{tm:"T6",t:1,q:"¿Cuál de estos NO figura entre los conocimientos básicos de las fichas de la Delegada para Asuntos Policivos y Civiles?",
o:["Derecho marítimo","Código Nacional de Seguridad y Convivencia Ciudadana","Código Nacional de Tránsito Terrestre","Estatuto Tributario de Bogotá"],
e:"Las fichas incluyen, entre otros, derecho constitucional, policivo, administrativo y civil, el Código de Seguridad y Convivencia, el de Tránsito, el Estatuto Tributario de Bogotá y la normativa de procesos de cobro.",f:"Manual 08-MN-001 v14, fichas 2.2.6"},
{tm:"T6",t:3,af:"Como sujeto procesal especial, el profesional de la Delegada para Asuntos Policivos y Civiles puede solicitar medidas cautelares cuando se trate del cumplimiento de una función específica del Ministerio Público.",
rz:"Las fichas le permiten dictar sentencia en los procesos civiles de mínima cuantía.",a:2,
e:"La afirmación está en las funciones de las fichas (interponer recursos, conceptuar, pedir nulidades y pruebas, y medidas cautelares en ese supuesto). La razón es falsa: el Ministerio Público interviene, no decide.",f:"Manual 08-MN-001 v14, fichas 2.2.6"},
{tm:"T6",t:1,q:"¿Qué versión del Manual incorporó las dependencias y cargos del rediseño institucional del Acuerdo 978 de 2025?",
o:["Versión 13, del 18 de marzo de 2025","Versión 12, del 31 de enero de 2024","Versión 9, del 4 de febrero de 2020","Versión 1, del 8 de enero de 2016"],
e:"La versión 13 incorporó el rediseño del Acuerdo 978; la 14 depuró y estandarizó perfiles. La 12 ajustó los NBC según el SNIES y la 9 incorporó el rediseño del Acuerdo 755 de 2019.",f:"Manual 08-MN-001 v14, control de cambios"},
{tm:"T6",t:1,q:"Las fichas del Manual remiten, en materia de equivalencias entre estudios y experiencia, a:",
o:["El artículo 25 del Decreto Ley 785 de 2005","El artículo 125 de la Constitución","El artículo 19 de la Ley 909 de 2004","El Acuerdo 978 de 2025"],
e:"Cada ficha indica que se aplican las equivalencias del art. 25 del Decreto Ley 785 de 2005 o las normas que lo modifiquen.",f:"Manual 08-MN-001 v14, fichas (Equivalencias)"},
{tm:"T6",t:1,q:"¿Cuál de estas NO es una competencia comportamental por nivel jerárquico del Personero Delegado (nivel directivo) en el Manual?",
o:["Aporte técnico-profesional","Visión estratégica","Pensamiento sistémico","Resolución de conflictos"],
e:"El nivel directivo tiene visión estratégica, liderazgo efectivo, planeación, toma de decisiones, gestión del desarrollo de las personas, pensamiento sistémico y resolución de conflictos. El aporte técnico-profesional es del nivel profesional.",f:"Manual 08-MN-001 v14, ficha 2.2.6-DIR-040-03-1"},

/* ───────── T7 · Labores del nivel profesional y asistencial (Manual 08-MN-001) ───────── */
{tm:"T7",t:1,q:"¿Cuál de estas funciones NO es común al nivel profesional según el Manual 08-MN-001?",
o:["Definir, adoptar y dirigir las políticas, planes y estrategias de la dependencia","Emitir conceptos y absolver consultas en asuntos de su competencia","Realizar y coordinar estudios e investigaciones","Ejecutar y hacer seguimiento a programas y proyectos, verificando metas, indicadores y riesgos"],
e:"Definir y dirigir las políticas de la dependencia es función común del nivel directivo.",f:"Manual 08-MN-001 v14, Funciones comunes por niveles"},
{tm:"T7",t:2,q:"Sobre las funciones comunes del nivel asistencial según el Manual:",
s:["Recibir, radicar, clasificar, distribuir y archivar documentos y correspondencia.","Realizar actividades de apoyo administrativo para la ejecución de planes y proyectos.","Realizar la entrega y recibo de documentos y archivos mediante inventarios documentales.","Emitir conceptos jurídicos en los asuntos de la dependencia."],a:0,
e:"Verdaderas 1, 2 y 3. Emitir conceptos es función del nivel profesional y asesor.",f:"Manual 08-MN-001 v14, Funciones comunes – nivel asistencial"},
{tm:"T7",t:1,q:"Según el Manual, el Auxiliar Administrativo 407-02 y el Secretario 440-02 requieren:",
o:["Diploma de bachiller en cualquier modalidad y 18 meses de experiencia laboral","Título técnico profesional y 12 meses de experiencia","Título profesional sin experiencia","Diploma de bachiller sin experiencia"],
e:"Ambas fichas exigen bachiller en cualquier modalidad y 18 meses de experiencia laboral.",f:"Manual 08-MN-001 v14, fichas 0-ASI-407-02-1 y 1-ASI-440-02-1"},
{tm:"T7",t:1,q:"Las competencias por nivel jerárquico de las fichas asistenciales del Manual son:",
o:["Manejo de la información, relaciones interpersonales y colaboración","Aporte técnico-profesional, comunicación efectiva y gestión de procedimientos","Visión estratégica, liderazgo efectivo y planeación","Confiabilidad técnica, creatividad e innovación"],
e:"Fichas asistenciales: manejo de la información, relaciones interpersonales y colaboración. La segunda opción es del nivel profesional y la tercera del directivo.",f:"Manual 08-MN-001 v14, fichas asistenciales"},
{tm:"T7",t:1,q:"Cuando el Auxiliar Administrativo 407-02 está en las Delegadas de Instrucción, Juzgamiento o Segunda Instancia, le corresponde, entre otras funciones:",
o:["Elaborar los oficios de notificación y custodiar los expedientes cuando los implicados soliciten revisión, copias o desgloses","Proferir los autos de apertura de investigación","Decidir los recursos de apelación","Practicar pruebas en segunda instancia"],
e:"La ficha asigna funciones de apoyo: oficios de notificación, apoyo a notificaciones y audiencias, registro de providencias, custodia de expedientes y archivo.",f:"Manual 08-MN-001 v14, ficha 0-ASI-407-02-1"},
{tm:"T7",t:1,q:"Cuando el Auxiliar Administrativo 407-02 está en la Dirección de Conciliación y MASC, una de sus funciones es:",
o:["Registrar las audiencias de conciliación en el sistema de información dispuesto por el Ministerio de Justicia y del Derecho","Actuar como conciliador en audiencias de conciliación extrajudicial","Aprobar los acuerdos conciliatorios","Expedir las constancias de no acuerdo como conciliador"],
e:"La ficha le asigna elaborar citaciones, registrar las audiencias en el sistema del Ministerio de Justicia y actualizar el registro de abogados conciliadores.",f:"Manual 08-MN-001 v14, ficha 0-ASI-407-02-1"},
{tm:"T7",t:3,af:"El profesional debe realizar la entrega y recibo de documentos y archivos mediante inventarios documentales.",
rz:"El Manual incluye esa labor entre las funciones comunes del nivel profesional, conforme a los instrumentos archivísticos definidos.",a:0,
e:"Es la función común n.º 13 del nivel profesional. La razón da el fundamento de la afirmación.",f:"Manual 08-MN-001 v14, Funciones comunes – nivel profesional"},
{tm:"T7",t:1,q:"En las fichas de la Delegada para Asuntos Policivos y Civiles, el propósito principal del Profesional Universitario 219-01 se formula como:",
o:["Ejecutar la función de agente del Ministerio Público ante las autoridades administrativas, de policía y judiciales","Dirigir la intervención del Ministerio Público de la delegada","Diseñar los lineamientos institucionales en materia policiva y civil","Apoyar actividades asistenciales y de soporte administrativo"],
e:"219-01: ejecutar. 222-03 y 222-02: ejercer la función de agente. 222-04: dirigir, diseñar e implementar estrategias. El Personero Delegado dirige la intervención; el asistencial apoya.",f:"Manual 08-MN-001 v14, ficha 2.2.6-PRO-219-01-1"},
{tm:"T7",t:1,q:"Una de las funciones comunes del nivel técnico según el Manual es:",
o:["Ejecutar actividades técnicas relacionadas con la implementación y seguimiento de planes, programas y proyectos","Emitir conceptos y absolver consultas","Representar a la alta dirección ante instancias externas","Asesorar a la alta dirección en la formulación de políticas"],
e:"La segunda es profesional o asesora, la tercera directiva y la cuarta asesora.",f:"Manual 08-MN-001 v14, Funciones comunes – nivel técnico"},

/* ───────── T13 · Código de Integridad de la Personería (cartilla 2025) ───────── */
{tm:"T13",t:1,q:"¿Qué lema acompaña el Código de Integridad de la Personería de Bogotá?",
o:["«Somos una Personería resolutiva, oportuna, pero sobre todo humana»","«Bogotá camina segura»","«Lo público es sagrado, lo privado es negociable»","«Los valores de la casa»"],
e:"Es el lema de la cartilla. «Lo público es sagrado» aparece como principio de acción de honestidad, sin la segunda parte.",f:"Código de Integridad Personería, cartilla 2025"},
{tm:"T13",t:1,q:"El Código de Integridad de la Personería es el resultado de armonizar:",
o:["La Guía para la Ética del Servicio de la Personería y el Código de Integridad del Servicio Público","El Código Disciplinario Único y el Estatuto Anticorrupción","El Plan Estratégico Institucional y el Manual de Funciones","El Ideario Ético Distrital y el Código Penal"],
e:"La cartilla explica que fue un ejercicio participativo, con apoyo del Equipo de Gestores de Integridad.",f:"Código de Integridad Personería, cartilla 2025"},
{tm:"T13",t:1,q:"Los principios de acción del Código de Integridad de la Personería se expresan en términos de:",
o:["«Qué hago» y «Qué no hago» como servidor público íntegro","Derechos y deberes del ciudadano","Faltas leves, graves y gravísimas","Metas e indicadores de gestión"],
e:"Cada uno de los 7 valores tiene principios de acción en esas dos columnas.",f:"Código de Integridad Personería, cartilla 2025"},
{tm:"T13",t:1,q:"«Actúo siempre con fundamento en la verdad, cumpliendo mis deberes con transparencia, rectitud y siempre favoreciendo el interés general». Según el Código de la Personería, es la definición de:",
o:["Honestidad","Justicia","Compromiso","Liderazgo"],
e:"Definición de honestidad en la cartilla.",f:"Código de Integridad Personería, cartilla 2025"},
{tm:"T13",t:1,q:"«Reconozco, valoro y trato de manera digna a todas las personas, con sus virtudes y defectos, sin importar su labor, procedencia, títulos o cualquier otra condición». El valor es:",
o:["Respeto","Justicia","Diligencia","Crecimiento personal"],
e:"Definición de respeto en la cartilla.",f:"Código de Integridad Personería, cartilla 2025"},
{tm:"T13",t:1,q:"El valor que se define como el conocimiento y conciencia de los intereses de desarrollo personal y familiar, y la forma en que se articulan con el cumplimiento de los deberes institucionales, es:",
o:["Crecimiento personal","Liderazgo","Compromiso","Diligencia"],
e:"Es uno de los dos valores propios de la Personería, junto con liderazgo.",f:"Código de Integridad Personería, cartilla 2025"},
{tm:"T13",t:1,q:"«Jamás busco figurar y quedarme con el crédito del trabajo hecho por el equipo». ¿A qué valor corresponde este «qué no hago»?",
o:["Liderazgo","Honestidad","Respeto","Crecimiento personal"],
e:"Hace parte de los principios de acción del liderazgo, junto con no buscar culpables sino soluciones en consenso.",f:"Código de Integridad Personería, cartilla 2025"},
{tm:"T13",t:2,q:"Sobre los principios de acción del valor honestidad en el Código de la Personería:",
s:["Siempre digo la verdad, incluso cuando cometo errores.","No uso recursos públicos para fines personales, incluido el tiempo de mi jornada laboral.","Denuncio las faltas, delitos o violaciones de derechos que conozco en el ejercicio del cargo.","Puedo aceptar incentivos de interesados si no afectan mi decisión."],a:0,
e:"Verdaderas 1, 2 y 3. El código dice expresamente que no se aceptan incentivos, favores ni beneficios de interesados en un proceso de decisión.",f:"Código de Integridad Personería, cartilla 2025"},
{tm:"T13",t:1,q:"«No postergo las decisiones ni actividades que den solución a problemáticas ciudadanas… Hay cosas que sencillamente no se dejan para otro día». El valor es:",
o:["Diligencia","Compromiso","Justicia","Liderazgo"],
e:"Es un «qué no hago» de la diligencia.",f:"Código de Integridad Personería, cartilla 2025"},
{tm:"T13",t:1,q:"«Nunca permito que odios, simpatías, antipatías, caprichos, presiones o intereses de orden personal o grupal interfieran en mi criterio». El valor es:",
o:["Justicia","Respeto","Honestidad","Compromiso"],
e:"Es un «qué no hago» de la justicia, que exige imparcialidad y decisiones basadas en evidencia.",f:"Código de Integridad Personería, cartilla 2025"},
{tm:"T13",t:3,af:"Según el Código de la Personería, el servidor no debe pensar que su trabajo es un «favor» a la ciudadanía, sino un compromiso y un orgullo.",
rz:"El valor respeto permite postergar la atención de un ciudadano cuando el servidor está ocupado.",a:2,
e:"La afirmación es un principio del valor compromiso. La razón es falsa: el compromiso exige no ignorar nunca a un ciudadano y estar atento sin distracciones.",f:"Código de Integridad Personería, cartilla 2025"},
{tm:"T13",t:1,q:"¿A qué valor del Código de la Personería corresponde «No genero resistencia al cambio, sobre todo el que implique mejoramiento de los procesos»?",
o:["Crecimiento personal","Diligencia","Liderazgo","Respeto"],
e:"Es un «qué no hago» del crecimiento personal.",f:"Código de Integridad Personería, cartilla 2025"},
{tm:"T13",t:2,q:"Sobre los principios de acción del valor liderazgo:",
s:["Promuevo un clima laboral que facilita la información fluida, la confianza mutua y la sinergia grupal.","Impongo mi punto de vista en la toma de decisiones cuando tengo la razón.","Comparto mis conocimientos y retroalimento a mis compañeros.","Ante un error, primero identifico al culpable y luego busco soluciones."],a:1,
e:"Verdaderas 1 y 3. El código dice que nunca se actúa de manera arbitraria ni imponiendo el propio punto de vista, y que no se buscan culpables sino soluciones en consenso.",f:"Código de Integridad Personería, cartilla 2025"},
{tm:"T13",t:1,q:"Según la cartilla del Código de Integridad, el Equipo Líder de Integridad hace parte de:",
o:["La Dirección de Talento Humano","La Oficina de Control Interno","La Oficina de Control Disciplinario Interno","La Dirección de Planeación"],
e:"La cartilla presenta al Equipo Líder de Integridad de la Dirección de Talento Humano, junto con el Equipo de Gestores de Integridad.",f:"Código de Integridad Personería, cartilla 2025"}
];

const OPTS_III=["La afirmación y la razón son VERDADERAS y la razón es una explicación CORRECTA de la afirmación","La afirmación y la razón son VERDADERAS, pero la razón NO es una explicación correcta de la afirmación","La afirmación es VERDADERA, pero la razón es FALSA","La afirmación es FALSA, pero la razón es VERDADERA"];

2:"Tipo II · Opciones combinadas: una, dos, tres o todas las afirmaciones numeradas pueden ser correctas. Marque A si 1, 2 y 3 son correctas; B si 1 y 3; C si 2 y 4; D si solo la 4.",
3:"Tipo III · Análisis de relación: evalúe si la AFIRMACIÓN y la RAZÓN son verdaderas y si la razón explica correctamente la afirmación."};

/* ═══════ Utilidades ═══════ */
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
function shuffle(a,r=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const mem={};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]??d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}};
const KH="mc26_hist", KW="mc26_wrong", KT="mc26_theme", KQ="mc26_q", KS="mc26_series";
function fmt(sec){const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function makeItem(q,r){if(q.t===1){const order=shuffle([0,1,2,3],r);return{id:q.id,order,key:order.indexOf(0)}}return{id:q.id,order:[0,1,2,3],key:q.a}}
function optText(q,idx){return q.t===1?q.o[idx]:q.t===2?OPTS_II[idx]:OPTS_III[idx]}
function chip(tm){return `<span class="tchip tc${(tnum(tm)-1)%4}">Tema ${tnum(tm)} · ${esc(TEMAS[tm])}</span>`}

/* ═══════ Registro por pregunta y diagnóstico ═══════ */
function record(id,ok){const m=store.get(KQ,{});const r=m[id]||{ok:0,n:0,last:null};r.n++;if(ok)r.ok++;r.last=ok?1:0;m[id]=r;store.set(KQ,m);
  const w=new Set(store.get(KW,[]));ok?w.delete(id):w.add(id);store.set(KW,[...w])}
function diagnosis(){
  const m=store.get(KQ,{});
  return Object.keys(TEMAS).map(tm=>{
    const qs=BANK.filter(q=>q.tm===tm);const seen=qs.filter(q=>m[q.id]);
    const ok=seen.reduce((a,q)=>a+(m[q.id].last?1:0),0);
    const pct=seen.length?Math.round(ok/seen.length*100):null;const cov=Math.round(seen.length/qs.length*100);
    let st,rank;
    if(!seen.length){st="Sin practicar";rank=1}
    else if(pct<PASS){st="Reforzar";rank=0}
    else if(pct<85||cov<60){st="En progreso";rank=2}
    else{st="Dominado";rank=3}
    return{tm,total:qs.length,seen:seen.length,cov,pct,st,rank};
  }).sort((a,b)=>a.rank-b.rank||(a.pct??101)-(b.pct??101)||tnum(a.tm)-tnum(b.tm));
}
const STC={"Reforzar":"bad","Sin practicar":"muted2","En progreso":"amb","Dominado":"good"};
function diagRows(list,compact){
  return list.map(d=>`<div class="drow"><div class="dmain"><span class="st ${STC[d.st]}">${d.st}</span><b>${chip(d.tm)}</b>
    <span class="small muted">${d.seen?`Aciertos en la última respuesta: ${d.pct}% · Vistas ${d.seen}/${d.total} (${d.cov}%)`:`${d.total} preguntas disponibles`}</span></div>
    <div class="row"><button class="btn sm" onclick="startTopicSeries('${d.tm}')">Practicar serie</button>${compact?"":`<button class="btn alt sm" onclick="biblio('${d.tm}')">Fuentes</button>`}</div></div>`).join("");
}

/* ═══════ Simulacros fijos ═══════ */
const FIXED=(()=>{
  const r=rng(2026);const sims=[[],[],[]];
  [2,3].forEach(t=>{const g=shuffle(BANK.filter(q=>q.t===t),r).sort((a,b)=>tnum(a.tm)-tnum(b.tm));const cap=t===2?10:12;g.forEach((q,i)=>{if(sims[i%3].filter(x=>x.t===t).length<cap)sims[i%3].push(q)})});
  const t1=shuffle(BANK.filter(q=>q.t===1),r).sort((a,b)=>tnum(a.tm)-tnum(b.tm));
  const pool=[[],[],[]];t1.forEach((q,i)=>pool[i%3].push(q));
  sims.forEach((s,k)=>{
    const need=50-s.length;const byT={};pool[k].forEach(q=>(byT[q.tm]=byT[q.tm]||[]).push(q));
    const cnt={};s.forEach(q=>cnt[q.tm]=(cnt[q.tm]||0)+1);const picked=[];
    while(picked.length<need){const keys=Object.keys(byT).filter(t=>byT[t].length).sort((a,b)=>(cnt[a]||0)-(cnt[b]||0));if(!keys.length)break;const t=keys[0];picked.push(byT[t].shift());cnt[t]=(cnt[t]||0)+1}
    sims[k]=shuffle(s.concat(picked),r).map(q=>q.id);
  });
  return sims;
})();
function randomExam(){
  const ids=[];const byT={};shuffle(BANK).forEach(q=>(byT[q.tm]=byT[q.tm]||[]).push(q));
  Object.values(byT).forEach(arr=>ids.push(...arr.splice(0,2).map(q=>q.id)));
  ids.push(...shuffle(Object.values(byT).flat()).slice(0,50-ids.length).map(q=>q.id));
  return shuffle(ids);
}

/* ═══════ Series (máximo 20 preguntas) ═══════ */
function topicSeries(tm){const qs=BANK.filter(q=>q.tm===tm);const n=Math.ceil(qs.length/SERIE);const size=Math.ceil(qs.length/n);const out=[];for(let i=0;i<n;i++)out.push(qs.slice(i*size,(i+1)*size).map(q=>q.id));return out}
function startTopicSeries(tm){
  const m=store.get(KQ,{});const ser=topicSeries(tm);
  let idx=ser.findIndex(s=>s.some(id=>!m[id]));
  if(idx<0){const sc=ser.map(s=>s.filter(id=>m[id]&&m[id].last).length/s.length);idx=sc.indexOf(Math.min(...sc))}
  runSeries(tm,idx);
}
function runSeries(tm,i){const ser=topicSeries(tm);run("practice",shuffle(ser[i]),`Tema ${tnum(tm)} · Serie ${i+1} de ${ser.length}`,"S-"+tm+"-"+i)}
function runAspect(id){const a=ASPECTOS.find(x=>x.id===id);const m=store.get(KQ,{});
  const pool=BANK.filter(q=>a.temas.includes(q.tm));
  const pri=shuffle(pool).sort((x,y)=>(m[x.id]?(m[x.id].last?2:0):1)-(m[y.id]?(m[y.id].last?2:0):1));
  run("practice",shuffle(pri.slice(0,SERIE).map(q=>q.id)),"Serie por aspecto · "+a.nombre,"A-"+id)}

  <p class="muted">Fuentes oficiales para estudiar cada tema. Algunos documentos de la Personería solo se descargan desde su portal o la intranet.</p>
  <div class="row" style="margin-top:10px"><label for="bsel"><b>Ir al tema</b></label><select id="bsel" onchange="document.getElementById('bib-'+this.value).scrollIntoView({behavior:'smooth'})"><option value="GEN">Portales generales</option>${Object.entries(TEMAS).map(([k,v])=>`<option value="${k}">Tema ${tnum(k)} · ${esc(v)}</option>`).join("")}</select></div>
  ${block("GEN","Portales generales")}${Object.entries(TEMAS).map(([k,v])=>block(k,`Tema ${tnum(k)} · ${esc(v)}`)).join("")}
  <div class="row" style="margin-top:20px"><button class="btn" onclick="go('home')">Volver al inicio</button></div>`;
  window.scrollTo(0,0);
  if(focus){const el=document.getElementById("bib-"+focus);if(el){el.scrollIntoView();el.classList.add("hl")}}
}

/* ═══════ Práctica personalizada ═══════ */
function practiceSetup(){
  const list=Object.entries(TEMAS).map(([k,v])=>`<label class="tpick"><input type="checkbox" name="tm" value="${k}" checked><span><span class="n">Tema ${tnum(k)} · ${BANK.filter(q=>q.tm===k).length} preguntas</span><br>${esc(v)}</span></label>`).join("");
  app.innerHTML=`<h2 class="sec">Práctica personalizada</h2>
  <div class="panel">
    <div class="row"><button class="btn alt" onclick="document.querySelectorAll('[name=tm]').forEach(c=>c.checked=true)">Todos</button><button class="btn alt" onclick="document.querySelectorAll('[name=tm]').forEach(c=>c.checked=false)">Ninguno</button></div>
    <div class="tlist">${list}</div>
    <div class="row"><label for="nq"><b>Preguntas</b></label>
      <select id="nq"><option>10</option><option>15</option><option selected>20</option></select>
      <label for="tp"><b>Tipo</b></label>
      <select id="tp"><option value="0">Todos</option><option value="1">Solo Tipo I</option><option value="2">Solo Tipo II</option><option value="3">Solo Tipo III</option></select></div>
    <div class="row" style="margin-top:16px"><button class="btn" onclick="startPractice()">Empezar</button></div>
  </div>`;
}
function startPractice(){
  const tms=[...document.querySelectorAll("[name=tm]:checked")].map(c=>c.value);
  const n=Math.min(SERIE,+document.getElementById("nq").value), tp=+document.getElementById("tp").value;
  const pool=BANK.filter(q=>tms.includes(q.tm)&&(!tp||q.t===tp));
  if(!pool.length){alert("Selecciona al menos un tema con preguntas del tipo elegido.");return}
  run("practice",shuffle(pool).slice(0,n).map(q=>q.id),"Práctica personalizada");
}
function startWrong(){const w=store.get(KW,[]).filter(id=>BYID[id]);if(!w.length)return;run("practice",shuffle(w).slice(0,SERIE),"Repaso de falladas")}

/* ═══════ Motor de preguntas ═══════ */
function run(mode,ids,label,seriesKey){
  const items=ids.map(id=>makeItem(BYID[id],Math.random));
  S={mode,label,items,ans:Array(items.length).fill(null),mark:Array(items.length).fill(false),i:0,done:Array(items.length).fill(false),start:Date.now(),seriesKey,examKey:null};
  renderQ();
}
function startExam(key){
  const ids=key==="rnd"?randomExam():FIXED[+key.slice(3)-1];
  const label=key==="rnd"?"Simulacro aleatorio":"Simulacro "+key.slice(3)+" · Cuadernillo "+["A","B","C"][+key.slice(3)-1];
  const r=key==="rnd"?Math.random:rng(77*(+key.slice(3)));
  const items=ids.map(id=>makeItem(BYID[id],r));
  S={mode:"exam",label,items,ans:Array(items.length).fill(null),mark:Array(items.length).fill(false),i:0,done:[],start:Date.now(),examKey:key};
  startTimer();renderQ();
}
function startTimer(){stopTimer();tick=setInterval(()=>{const el=document.getElementById("tm");if(el&&S)el.textContent="⏱ "+fmt(Math.floor((Date.now()-S.start)/1000))},1000)}
function stopTimer(){if(tick)clearInterval(tick);tick=null}

function renderQ(){
  const it=S.items[S.i], q=BYID[it.id], n=S.items.length, exam=S.mode==="exam";
  const show=!exam&&S.done[S.i];
  bar.style.width=((S.i+1)/n*100)+"%";
  let body="";
  if(q.t===1) body=`<p class="qtext">${esc(q.q)}</p>`;
  if(q.t===2) body=`<p class="qtext">${esc(q.q)}</p><ol class="stmts">${q.s.map((s,k)=>`<li><b>${k+1}.</b><span>${esc(s)}</span></li>`).join("")}</ol>`;
  if(q.t===3) body=`<div class="ar"><div><span>AFIRMACIÓN</span>${esc(q.af)}</div><p class="porque">PORQUE</p><div><span>RAZÓN</span>${esc(q.rz)}</div></div>`;
  const opts=it.order.map((oi,pos)=>{let cls="opt";
    if(show){if(pos===it.key)cls+=" ok";else if(pos===S.ans[S.i])cls+=" no"}else if(pos===S.ans[S.i])cls+=" sel";
    return `<button class="${cls}" ${show?"disabled":""} onclick="pick(${pos})" aria-pressed="${pos===S.ans[S.i]}"><span class="l">${L[pos]}</span><span>${esc(optText(q,oi))}</span></button>`}).join("");
  let fb="";
  if(show){const ok=S.ans[S.i]===it.key;
    fb=`<div class="fb ${ok?"ok":"no"}" role="status"><h4>${ok?"¡Correcto!":"Respuesta correcta: "+L[it.key]}</h4><p>${esc(q.e)}</p><p class="src">Fuente: ${esc(q.f)} · <a href="#" onclick="biblio('${q.tm}');return false">ver documentos del tema</a></p></div>`}
  const navBtns=exam?
    `<button class="btn alt" onclick="move(-1)" ${S.i===0?"disabled":""}>← Anterior</button>
     <button class="mark ${S.mark[S.i]?"on":""}" onclick="S.mark[S.i]=!S.mark[S.i];renderQ()">${S.mark[S.i]?"★ Marcada":"☆ Marcar para revisar"}</button>
     ${S.i<n-1?`<button class="btn" onclick="move(1)">Siguiente →</button>`:`<button class="btn coral" onclick="submitExam()">Entregar prueba</button>`}`
    : show?`<button class="btn alt" onclick="finishPractice()">Terminar</button>${S.i<n-1?`<button class="btn" onclick="move(1)">Siguiente →</button>`:`<button class="btn coral" onclick="finishPractice()">Ver resultados</button>`}`
    :`<button class="btn alt" onclick="finishPractice()">Terminar</button><button class="btn" onclick="check()" ${S.ans[S.i]!==null?"":"disabled"}>Calificar</button>`;
  const dots=exam?`<div class="dots" aria-label="Navegación de preguntas">${S.items.map((_,k)=>`<button class="dot ${S.ans[k]!==null?"ans":""} ${S.mark[k]?"mk":""} ${k===S.i?"cur":""}" onclick="S.i=${k};renderQ()" aria-label="Pregunta ${k+1}${S.ans[k]!==null?", respondida":""}${S.mark[k]?", marcada":""}">${k+1}</button>`).join("")}</div>
     <p class="small muted" style="margin-top:8px">Respondidas: ${S.ans.filter(a=>a!==null).length} de ${n} · La línea amarilla indica preguntas marcadas.</p>`:"";
  app.innerHTML=`
  <div class="qhead"><span class="pill">${esc(S.label)}</span>${exam?`<span class="timer" id="tm">⏱ ${fmt(Math.floor((Date.now()-S.start)/1000))}</span>`:""}</div>
  <div class="panel">
    <div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Pregunta ${S.i+1} de ${n}</b><span class="pill t${q.t}">${TIPO[q.t]}</span></div>
    <div style="margin-bottom:10px">${chip(q.tm)}</div>
    <div class="howto">${HOWTO[q.t]}</div>
    ${body}
    <div class="opts" role="group" aria-label="Opciones de respuesta">${opts}</div>
    ${fb}
    <div class="qnav">${navBtns}</div>
  </div>${dots}`;
  if(show)document.getElementById("live").textContent=S.ans[S.i]===it.key?"Correcto":"Incorrecto. La respuesta correcta es "+L[it.key];
}
function pick(pos){if(!S||(S.mode!=="exam"&&S.done[S.i]))return;S.ans[S.i]=pos;renderQ()}
function check(){if(S.ans[S.i]===null)return;S.done[S.i]=true;const it=S.items[S.i];record(it.id,S.ans[S.i]===it.key);renderQ()}
function move(d){S.i=Math.max(0,Math.min(S.items.length-1,S.i+d));renderQ();window.scrollTo({top:0,behavior:"smooth"})}
function submitExam(){
  const pend=S.ans.filter(a=>a===null).length;
  if(pend&&!confirm(`Tienes ${pend} pregunta(s) sin responder. ¿Entregar de todos modos?`))return;
  stopTimer();S.items.forEach((it,k)=>record(it.id,S.ans[k]===it.key));results(S.items.map((_,k)=>k));
}
function finishPractice(){const idx=S.items.map((_,k)=>k).filter(k=>S.done[k]);if(!idx.length){go("home");return}results(idx)}

/* ═══════ Acta de calificación ═══════ */
function results(idx){
  const sec=Math.floor((Date.now()-S.start)/1000);
  const rows=idx.map(k=>{const it=S.items[k];return{k,it,q:BYID[it.id],ok:S.ans[k]===it.key}});
  const ok=rows.filter(r=>r.ok).length,n=rows.length,pct=Math.round(ok/n*100);
  const h=store.get(KH,[]);h.push({date:new Date().toLocaleString("es-CO",{dateStyle:"short",timeStyle:"short"}),mode:S.examKey||"practice",label:S.label,ok,n,pct});store.set(KH,h.slice(-40));
  if(S.seriesKey){const sv=store.get(KS,{});sv[S.seriesKey]=pct;store.set(KS,sv)}
  const agg=f=>{const m={};rows.forEach(r=>{const k=f(r);m[k]=m[k]||{ok:0,n:0};m[k].n++;if(r.ok)m[k].ok++});return m};
  const byT=agg(r=>r.q.tm);
  const bars=(m,name)=>Object.entries(m).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([k,v])=>{const p=Math.round(v.ok/v.n*100);const c=p>=PASS?"var(--ok)":p>=50?"var(--amber)":"var(--bad)";
    return `<div class="bar"><div class="t"><span>${esc(name(k))}</span><span>${v.ok}/${v.n} · ${p}%</span></div><div class="tr"><i style="width:${p}%;background:${c}"></i></div></div>`}).join("");
  const pass=pct>=PASS, col=pass?"var(--ok)":pct>=50?"var(--amber)":"var(--bad)";
  const weak=Object.entries(byT).filter(([k,v])=>v.ok/v.n<PASS/100).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n);
  const weakBlock=weak.length?`<p style="margin-bottom:8px">En este intento quedaste por debajo de ${PASS}% en ${weak.length} tema(s). Practica su serie y revisa sus fuentes:</p>${weak.map(([k,v])=>`<div class="drow"><div class="dmain"><span class="st bad">${Math.round(v.ok/v.n*100)}%</span><b>${chip(k)}</b></div><div class="row"><button class="btn sm" onclick="startTopicSeries('${k}')">Practicar serie</button><button class="btn alt sm" onclick="biblio('${k}')">Fuentes</button></div></div>`).join("")}`
    :`<p>Ningún tema de este intento quedó por debajo de ${PASS}%. Revisa el diagnóstico para ver los temas aún sin practicar.</p>`;
  const fails=rows.filter(r=>!r.ok);
  const rev=fails.map(r=>{const q=r.q,it=r.it;const head=q.t===3?"Afirmación: "+q.af+" — Razón: "+q.rz:q.q;
    const yours=S.ans[r.k]===null?"Sin responder":L[S.ans[r.k]]+". "+optText(q,it.order[S.ans[r.k]]);
    return `<details><summary>${r.k+1}. ${esc(head.length>140?head.slice(0,140)+"…":head)}</summary><div class="ans"><div style="margin:8px 0">${chip(q.tm)}</div>
      ${q.t===2?`<ol class="stmts">${q.s.map((s,j)=>`<li><b>${j+1}.</b><span>${esc(s)}</span></li>`).join("")}</ol>`:""}
      <p><b>Tu respuesta:</b> ${esc(yours)}</p><p><b>Correcta:</b> ${L[it.key]}. ${esc(optText(q,it.order[it.key]))}</p><p style="margin-top:6px">${esc(q.e)}</p><p class="small muted">Fuente: ${esc(q.f)}</p></div></details>`}).join("");
  bar.style.width="100%";
  app.innerHTML=`<h2 class="sec">Acta de calificación</h2>
  <div class="panel"><div class="score"><div class="ring" style="--p:${pct};--c:${col}"><div><span><b>${pct}</b><br><small>de 100</small></span></div></div>
   <div><p class="verdict">${pass?"Superas el umbral de 70 puntos":"Aún por debajo del umbral de 70 puntos"}</p><p class="muted">${esc(S.label)} · ${ok} aciertos de ${n}${S.mode==="exam"?" · Tiempo: "+fmt(sec):""}</p>
   <p class="small muted" style="margin-top:6px">El Anexo Técnico selecciona a quienes obtengan 70 puntos o más y mejor resultado en su nivel.</p></div></div></div>
  <h2 class="sec">Qué profundizar</h2><div class="panel">${weakBlock}<div class="row" style="margin-top:12px"><button class="btn alt" onclick="go('diagnostico')">Ver diagnóstico acumulado</button></div></div>
  <h2 class="sec">Desempeño por tema</h2><div class="panel bars">${bars(byT,k=>"Tema "+tnum(k)+" · "+TEMAS[k])}</div>
  <h2 class="sec">Desempeño por tipo de pregunta</h2><div class="panel bars">${bars(agg(r=>r.q.t),k=>TIPO[k])}</div>
  <h2 class="sec">Preguntas para repasar (${fails.length})</h2>
  ${fails.length?`<div class="rev">${rev}</div>`:`<div class="panel">Sin errores. ¡Excelente!</div>`}
  <div class="row" style="margin-top:20px"><button class="btn" onclick="go('home')">Volver al inicio</button>${fails.length?`<button class="btn alt" onclick="run('practice',${JSON.stringify(fails.map(r=>r.it.id).slice(0,SERIE)).replace(/"/g,"&quot;")},'Repaso de este intento')">Repasar las falladas</button>`:""}</div>`;
  window.scrollTo(0,0);
}

/* ═══════ Metodología y alcance ═══════ */
function metodo(){
  app.innerHTML=`<h2 class="sec">Metodología de las preguntas</h2>
  <div class="panel"><p>El simulador usa los tres tipos de ítem de la guía de pruebas de la Procuraduría General de la Nación, el mismo sistema de tu preparación para la Rama Judicial. El Anexo Técnico no publica el formato que usará la Universidad Distrital, así que conviene dominar los tres.</p></div>
  <h2 class="sec">Tipo I · Única respuesta</h2><div class="panel"><p>Un enunciado y cuatro opciones; solo una es correcta. El orden de las opciones se baraja en cada intento, para que memorices el contenido y no la letra.</p></div>
  <h2 class="sec">Tipo II · Opciones combinadas</h2><div class="panel"><p>Cuatro afirmaciones numeradas. Marca según esta clave:</p>
   <table style="margin-top:10px"><tbody>${OPTS_II.map((o,i)=>`<tr><td><b>${L[i]}</b></td><td>${o}</td></tr>`).join("")}</tbody></table>
   <div class="warn"><b>Truco:</b> empieza por la afirmación 4. Si es verdadera, solo pueden ser C o D; si es falsa, solo A o B. Luego decide con la 2.</div></div>
  <h2 class="sec">Tipo III · Afirmación — Razón</h2><div class="panel"><p>Evalúa por separado la afirmación y la razón; después, si la razón explica la afirmación.</p>
   <table style="margin-top:10px"><tbody>${OPTS_III.map((o,i)=>`<tr><td><b>${L[i]}</b></td><td>${o}</td></tr>`).join("")}</tbody></table>
   <div class="warn"><b>Ojo:</b> no hay opción para «ambas falsas». Si ambas son verdaderas, pregúntate: ¿la afirmación es cierta <i>por</i> lo que dice la razón?</div></div>
  <div class="row" style="margin-top:20px"><button class="btn" onclick="go('home')">Volver al inicio</button></div>`;
}
function fuentes(){
  app.innerHTML=`<h2 class="sec">Qué se verificó y qué falta</h2>
  <div class="panel"><h3 style="font-family:var(--display);margin-bottom:8px">Documentos leídos completos</h3><ul class="list">
   <li>Acuerdo Distrital 978 de 2025 (texto completo).</li>
   <li>Decreto Ley 1421 de 1993, texto vigente.</li>
   <li>Resolución 180 de 2025 (MECI, Comité Directivo Institucional y Modelo de Gestión) — documento aportado.</li>
   <li>Plan Estratégico Institucional 2024-2028, 01-PL-012 versión 4 — documento aportado.</li>
   <li>Manual Específico de Funciones 08-MN-001 versión 14 (994 páginas) — documento aportado.</li>
   <li>Cartilla del Código de Integridad de la Personería (7 valores y principios de acción) — documento aportado.</li>
   <li>Página del SGA en la intranet (política ambiental).</li>
   <li>Normas nacionales de los temas transversales (ver la Biblioteca).</li></ul></div>
  <div class="panel" style="margin-top:12px"><h3 style="font-family:var(--display);margin-bottom:8px">Pendientes por consultar</h3>
  <div class="warn" style="margin-top:0"><ul class="list">
   <li><b>Resolución 1567-10000-2026</b>: el acto que adopta el manual no se encontró; el manual v14 sí se leyó completo.</li>
   <li><b>Anexos del PEI</b> (PESTEL, DOFA y matriz de metas): el portal de la Personería bloquea la lectura automática.</li>
   <li><b>Documentos del SGA</b>: matriz de aspectos e impactos, matriz de riesgos ambientales y PIGA (bloqueados para lectura automática).</li>
   <li><b>Resoluciones internas 371 de 2024 y 195 de 2025</b>, citadas en la normatividad del PEI.</li>
   <li><b>Reglamento de Incentivos 2026</b> de la Personería, citado en el Anexo Técnico.</li></ul></div></div>
  <div class="row" style="margin-top:20px"><button class="btn" onclick="go('biblio')">Abrir la Biblioteca</button><button class="btn alt" onclick="go('home')">Volver al inicio</button></div>`;
}

/* ═══════ Tema visual, teclado e inicio ═══════ */
function toggleTheme(){const r=document.documentElement;const cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.dataset.theme=cur==="dark"?"light":"dark";store.set(KT,r.dataset.theme)}
(()=>{const t=store.get(KT,null);if(t)document.documentElement.dataset.theme=t})();
document.addEventListener("keydown",e=>{if(!S||["SELECT","INPUT"].includes(e.target.tagName))return;
  const k=e.key.toUpperCase();const map={A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
  if(k in map){pick(map[k]);return}
  if(e.key==="Enter"&&S.mode!=="exam"){if(!S.done[S.i])check();else if(S.i<S.items.length-1)move(1)}
  if(e.key==="ArrowRight"&&S.mode==="exam")move(1);
  if(e.key==="ArrowLeft"&&S.mode==="exam")move(-1);
});
home();

</script>
